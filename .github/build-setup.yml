# Extra steps cargo-dist inserts into release.yml's build-local-artifacts
# job, before `dist build` (`github-build-setup` in Cargo.toml's
# [workspace.metadata.dist]; the path is relative to .github/workflows).
# It lives outside .github/workflows because GitHub would try to run a
# bare step list there as a workflow. Edit this file, then run
# `dist generate --mode=ci` to copy it into release.yml.
#
# The Windows ARM64 runner image (windows-11-arm) has no WiX Toolset, so
# the v0.1.0-rc.1 release failed building the aarch64 MSI with "The
# compiler application (candle) could not be found". The x64 image
# (windows-2025) has WiX 3.14.1 preinstalled, so this installs the same
# version here and nowhere else. cargo-dist's MSI backend (cargo-wix) needs
# WiX 3, not 4+, and 3.14 is the first WiX 3 that builds ARM64 MSIs
# (candle -arch arm64). Its tools are .NET Framework 4.5 programs; the
# image ships .NET Framework 4.8.1, which runs them on ARM64.
#
# The zip is the official wixtoolset/wix3 release asset. GitHub publishes
# no digest for it, so the hash is pinned from our own download; a
# mismatch fails the job rather than building an MSI with unknown tools.
- name: Install WiX Toolset 3.14.1 on Windows ARM64
  if: runner.os == 'Windows' && runner.arch == 'ARM64'
  shell: pwsh
  run: |
    $ErrorActionPreference = 'Stop'
    $zip = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
    Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $zip
    $expected = '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31'
    $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
    if ($actual -ne $expected) { throw "wix314-binaries.zip sha256 is $actual, expected $expected" }
    # cargo-wix looks for %WIX%\bin\candle.exe (and light.exe), so the
    # tools go in a bin folder under the directory WIX names.
    $wix = Join-Path $env:RUNNER_TEMP 'wix314'
    $bin = Join-Path $wix 'bin'
    Expand-Archive -LiteralPath $zip -DestinationPath $bin
    "WIX=$wix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
    # Run candle once so a missing .NET runtime fails here, by name,
    # rather than as an opaque WiX error after the whole Rust build. The
    # hash already pins the version; this only checks the tool starts.
    $banner = & (Join-Path $bin 'candle.exe') -? | Out-String
    if ($banner -notmatch 'Toolset Compiler') { throw "candle.exe did not run:`n$banner" }
    exit 0
