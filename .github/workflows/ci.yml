# Tests on every pull request and push to main, and the gate a release
# passes before cargo-dist builds anything (release.yml calls this workflow
# as a plan job: `plan-jobs` in Cargo.toml's [workspace.metadata.dist]).
#
# - lint: rustfmt, the licence copies, the vendored crates' patch series
#   (scripts/vendor-check.sh), the release config;
# - test: clippy, cargo test and the conformance suite on macOS arm64,
#   Linux x86_64 and Linux aarch64 (output depends on the architecture and
#   the platform's libm, so each is its own output path);
# - windows: the CLI builds and its tests pass (x86_64), and serves over a
#   named pipe;
# - linux-app: the GTK desktop app builds, its tests pass, and it runs
#   headless;
# - wasm: scripts/wasm-check.sh.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - run: scripts/release/licenses.sh --check
      - name: Vendored crates are their releases plus vendor/patches
        run: scripts/vendor-check.sh
      - name: Release workflow matches its config
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh | sh
          dist generate --mode=ci --check
          dist plan --output-format=json > /dev/null

  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
          - name: Linux x86_64
            runner: ubuntu-22.04
          - name: Linux aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          # lavapipe (Vulkan) and llvmpipe (EGL/GL): software GPUs for PNG
          # export; poppler for the PDF export cases.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 libegl1 libgles2 libgl1-mesa-dri poppler-utils
          # Mesa's Vulkan device-select layer asks Wayland for the default
          # GPU, and without XDG_RUNTIME_DIR libwayland prints an error line
          # on every GPU open (packaging/docker/build.Dockerfile).
          if [ -z "${XDG_RUNTIME_DIR:-}" ]; then
            mkdir -p "$RUNNER_TEMP/xdg"
            chmod 700 "$RUNNER_TEMP/xdg"
            echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg" >> "$GITHUB_ENV"
          fi

      - name: macOS packages
        if: runner.os == 'macOS'
        run: |
          # The OpenSCAD nightly draws tier 3's meshes; poppler rasterises PDFs.
          brew install poppler
          brew install --cask openscad@snapshot
          app=$(find /Applications -maxdepth 1 -name 'OpenSCAD*.app' | head -1)
          echo "OPENSCAD_RENDERER=$app/Contents/MacOS/OpenSCAD" >> "$GITHUB_ENV"

      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            cargo test --locked --no-fail-fast
          else
            # neoscad-ffi is the macOS app's core and ships nowhere else, so
            # it is left out here. (Its tests do pass on Linux without a GPU;
            # clippy above still checks it, with its Metal-only tests and
            # their fixtures compiled out.)
            cargo test --locked --no-fail-fast --workspace --exclude neoscad-ffi
          fi

      - name: OpenSCAD reference
        uses: actions/cache@v6
        with:
          path: .reference/openscad
          key: openscad-${{ hashFiles('conformance/manifest.json') }}
      - run: scripts/release/fetch-reference.sh

      - run: cargo build --locked --release -p neoscad-cli -p neoscad-conformance
      - run: target/release/conformance manifest --check

      - name: Conformance
        run: |
          if [ -n "${OPENSCAD_RENDERER:-}" ]; then
            target/release/conformance run --renderer "$OPENSCAD_RENDERER"
          else
            # Tier 3 needs the OpenSCAD nightly to draw neoscad's meshes, and
            # there is none for Linux aarch64; every other tier runs, and
            # the baseline gates what runs (docs/packaging.md, "Linux").
            target/release/conformance run --tier 0 --tier 1 --tier 2 --tier 4 --tier 5
          fi

      - name: PNG export on the OpenGL fallback
        if: runner.os == 'Linux'
        run: |
          echo 'cube(10); sphere(8);' > "$RUNNER_TEMP/smoke.scad"
          VK_ICD_FILENAMES=/nonexistent.json VK_DRIVER_FILES=/nonexistent.json \
            target/release/neoscad "$RUNNER_TEMP/smoke.scad" -o "$RUNNER_TEMP/smoke.png"
          VK_ICD_FILENAMES=/nonexistent.json VK_DRIVER_FILES=/nonexistent.json \
            target/release/neoscad --info | grep -E '^GPU'

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p neoscad-cli
      - run: cargo test --locked --no-fail-fast -p neoscad-cli -p neoscad-lang
      - name: The user library directory is Documents\OpenSCAD\libraries
        shell: pwsh
        run: |
          $want = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'OpenSCAD\libraries'
          $info = & target\release\neoscad.exe --info
          $line = $info | Select-String '^User Library Path: '
          if ("$line" -ne "User Library Path: $want") { throw "got '$line', want '$want'" }
      # `cargo test` above already runs the transport's unit tests and the
      # served-output tests over a pipe; this is the release binary as a
      # user runs it: `serve --socket` on the default pipe (named by
      # NEOSCAD_SOCKET here, so parallel jobs cannot meet), an export the
      # command line hands to it, then `--stop`.
      - name: neoscad serve on a named pipe, with the command line as its client
        shell: pwsh
        run: |
          $env:NEOSCAD_SOCKET = "neoscad-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $exe = Resolve-Path target\release\neoscad.exe
          $server = Start-Process -FilePath $exe -ArgumentList 'serve', '--socket', '--idle-timeout', '120' -PassThru -NoNewWindow
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Milliseconds 200
            & $exe serve --status
          } until ($LASTEXITCODE -eq 0 -or (Get-Date) -gt $deadline)
          if ($LASTEXITCODE -ne 0) { throw "the server did not start" }
          $before = (& $exe serve --status --format json | ConvertFrom-Json).stats.requests
          Set-Content -Path "$env:RUNNER_TEMP\cube.scad" -Value 'cube(10);'
          & $exe "$env:RUNNER_TEMP\cube.scad" -o "$env:RUNNER_TEMP\cube.stl"
          if ($LASTEXITCODE -ne 0) { throw "the export failed" }
          if (-not (Test-Path "$env:RUNNER_TEMP\cube.stl")) { throw "no cube.stl" }
          $after = (& $exe serve --status --format json | ConvertFrom-Json).stats.requests
          if ($after -le $before) { throw "the export was not served ($before -> $after requests)" }
          & $exe serve --stop
          if (-not $server.WaitForExit(30000)) { throw "the server did not stop" }
          & $exe serve --status
          if ($LASTEXITCODE -eq 0) { throw "a server still answers after --stop" }
          $global:LASTEXITCODE = 0

  # The Linux desktop app (crates/linux-app, docs/linux-app.md): clippy and
  # tests with GTK, then a headless run that opens a model, previews it
  # and previews it again after typing in the editor. Ubuntu 24.04 is the
  # first LTS with GTK 4.14, libadwaita 1.5 and WebKitGTK 6.0; the `test`
  # jobs above build the crate without its `gtk` feature, so they need
  # none of these packages.
  linux-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev \
            mesa-vulkan-drivers libvulkan1 libegl1 libgl1-mesa-dri \
            xvfb xauth dbus-daemon xdotool
          # As in the test job: Mesa's Vulkan device-select layer wants it.
          mkdir -p "$RUNNER_TEMP/xdg"
          chmod 700 "$RUNNER_TEMP/xdg"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg" >> "$GITHUB_ENV"
      - run: cargo clippy --locked -p neoscad-linux-app --features gtk --all-targets -- -D warnings
      - run: cargo test --locked -p neoscad-linux-app --features gtk
      - run: cargo build --locked -p neoscad-linux-app --features gtk
      - name: The editor bundle
        run: scripts/apple/build-editor.sh
      - name: The app previews a model and follows typing, headless
        run: TYPE=1 linux/smoke.sh target/debug/neoscad-gtk web/examples/CSG.scad

  wasm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: scripts/wasm-check.sh
