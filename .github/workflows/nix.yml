# Builds the Nix package (flake.nix, through packaging/nix/package.nix,
# the file submitted to nixpkgs) with its tests, on Linux x86_64 and
# macOS arm64, then runs it and exports a model; and by hand. ci.yml
# covers the code itself.
#
# The package is built from a fileset (packaging/nix/local.nix), not the
# whole tree, so a test or build script that starts reading a file outside
# it (a doc page, a conformance case) passes ci.yml and fails here. A pull
# request therefore runs it when the packaging or the dependency set
# changes, or when what reads files does: the crates' integration tests,
# their build scripts and manifests, and the fileset's single files (a
# rename drops them from the package). It runs on Linux alone there, since
# the fileset is the same on every platform; a push to main runs both.
# To try packaging work on a branch before its pull request, run it by
# hand (`gh workflow run nix.yml --ref <branch>`).
name: Nix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - packaging/nix/**
      - Cargo.toml
      - Cargo.lock
      - crates/*/Cargo.toml
      - crates/*/build.rs
      - crates/*/tests/**
      - docs/fillet-edges.md
      - docs/geometry-queries.md
      - docs/sketch.md
      - .github/workflows/nix.yml
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - packaging/nix/**
      - Cargo.toml
      - Cargo.lock
      - crates/*/Cargo.toml
      - crates/*/build.rs
      - crates/*/tests/**
      - docs/fillet-edges.md
      - docs/geometry-queries.md
      - docs/sketch.md
      - .github/workflows/nix.yml

permissions:
  contents: read

# A new push to a pull request cancels its superseded run; on main each
# commit is its own group, so nothing there is cancelled.
concurrency:
  group: nix-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: nix (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"name":"Linux x86_64","runner":"ubuntu-22.04"}]'
          || '[{"name":"Linux x86_64","runner":"ubuntu-22.04"},{"name":"macOS arm64","runner":"macos-15"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # `nix flake check` builds the package for this system, which runs
      # its tests (checkPhase) and `neoscad --version` (versionCheckHook).
      - run: nix flake check -L
      - name: The package runs, exports a model and has its man page
        run: |
          nix run . -- --version
          nix build
          echo 'difference() { cube(10, center=true); sphere(6); }' > smoke.scad
          ./result/bin/neoscad smoke.scad -o smoke.stl
          grep -q '^solid' smoke.stl
          test -f result/share/man/man1/neoscad.1.gz
          test -f result/share/zsh/site-functions/_neoscad
