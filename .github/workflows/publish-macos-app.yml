# The macOS app: scripts/apple/release.sh builds, signs, notarizes and
# smoke-tests the DMG, and this job attaches it to the GitHub Release that
# cargo-dist's release.yml created. It runs as one of that workflow's
# publish jobs (`publish-jobs` in Cargo.toml's [workspace.metadata.dist]),
# after the release exists and before it is announced, because a release
# made with the workflow token cannot trigger a separate workflow.
#
# cargo-dist's own macOS signing is not used: it signs a bare binary, while
# the app needs its hardened-runtime entitlements, notarization and a
# stapled DMG, which release.sh already does and checks.
#
# Secrets (repository settings, all optional as a set):
#   NEOSCAD_DEVELOPER_ID_P12           base64 of the "Developer ID Application" .p12
#   NEOSCAD_DEVELOPER_ID_P12_PASSWORD  its password
#   NEOSCAD_SIGN_IDENTITY              the identity's name or SHA-1
#   NEOSCAD_TEAM_ID                    the Apple team id
#   NEOSCAD_NOTARY_KEY                 an App Store Connect API key (.p8 contents)
#   NEOSCAD_NOTARY_KEY_ID              its key id
#   NEOSCAD_NOTARY_ISSUER              its issuer id
# Without them the app is built ad-hoc signed and smoke-tested, and nothing
# is uploaded: an ad-hoc DMG fails Gatekeeper on every other Mac.
#
# With them, a release also pushes the app's Homebrew cask
# (packaging/homebrew/neoscad-app.rb) to neoscad/homebrew-tap, using
#   HOMEBREW_TAP_TOKEN                 the token cargo-dist's formula push uses
# (release.yml passes every secret to this workflow: `secrets: inherit`).
#
# workflow_dispatch runs the same build as a dry run (no upload).
name: macOS app

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  app:
    # macos-15's default Xcode (16.4) is too old for the app's Swift 6
    # concurrency checks; macos-26 has Xcode 26.6, the newest hosted one
    # (development uses Xcode 27, which hosted runners don't offer yet).
    # Pinned, so an image update can't change the toolchain unannounced.
    runs-on: macos-26
    # Two notarizations (the app, then the DMG) wait on Apple's queue, which
    # held a new team's first submission for over two hours. Hosted jobs
    # may run for 6 hours; standard runners are free for public repos.
    timeout-minutes: 300
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HAVE_SIGNING: ${{ secrets.NEOSCAD_DEVELOPER_ID_P12 != '' && secrets.NEOSCAD_NOTARY_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # release.sh numbers the build with `git rev-list --count HEAD`.
          fetch-depth: 0

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen
          rustup show active-toolchain
          node --version

      - name: Signing keychain
        if: env.HAVE_SIGNING == 'true'
        env:
          P12: ${{ secrets.NEOSCAD_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.NEOSCAD_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NEOSCAD_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NEOSCAD_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NEOSCAD_NOTARY_ISSUER }}
        run: |
          kc="$RUNNER_TEMP/neoscad.keychain-db"
          kc_pass=$(uuidgen)
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          # The default keychain, so release.sh's `security find-identity`
          # and notarytool's --keychain-profile find what is stored here.
          security list-keychains -d user -s "$kc"
          security default-keychain -s "$kc"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" >/dev/null
          rm "$RUNNER_TEMP/id.p12"
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials neoscad-notary \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          rm "$RUNNER_TEMP/notary.p8"

      - name: Build, sign, notarize, smoke-test
        env:
          NEOSCAD_SIGN_IDENTITY: ${{ env.HAVE_SIGNING == 'true' && secrets.NEOSCAD_SIGN_IDENTITY || '' }}
          NEOSCAD_TEAM_ID: ${{ secrets.NEOSCAD_TEAM_ID }}
          NEOSCAD_NOTARY_PROFILE: ${{ env.HAVE_SIGNING == 'true' && 'neoscad-notary' || '' }}
        run: scripts/apple/release.sh

      - name: Attach to the release
        if: env.HAVE_SIGNING == 'true' && inputs.plan != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.plan && fromJson(inputs.plan).announcement_tag || '' }}
        run: |
          cd dist
          # The DMG (universal), its symbols and build record. The universal
          # CLI tarball release.sh also makes stays out: cargo-dist 0.33.0
          # cannot build a universal2 archive, so the release's macOS CLIs
          # are its aarch64- and x86_64-apple-darwin archives, which the
          # installers and the Homebrew formula point at.
          files=(NeoSCAD-*.dmg NeoSCAD-*-dSYMs.zip)
          shasum -a 256 "${files[@]}" > NeoSCAD-macos-app.sha256
          cp BUILDINFO.txt NeoSCAD-macos-app-BUILDINFO.txt
          gh release upload "$TAG" "${files[@]}" NeoSCAD-macos-app.sha256 \
            NeoSCAD-macos-app-BUILDINFO.txt --repo "$GITHUB_REPOSITORY"

      # The cask goes to the same tap as cargo-dist's `neoscad` formula
      # (release.yml's publish-homebrew-formula job), and only from here:
      # this is the one job that knows the DMG's build number and checksum,
      # and it runs only once the notarized DMG is on the release, so the
      # cask can never point at a missing or unsigned file.
      #
      # A prerelease publishes it too when `publish-prereleases` is set, as
      # it does the formula: Homebrew casks have no prerelease channel, so
      # the tap's one `neoscad-app` moves to the prerelease.
      - name: Homebrew cask
        if: env.HAVE_SIGNING == 'true' && inputs.plan != ''
        env:
          TAG: ${{ inputs.plan && fromJson(inputs.plan).announcement_tag || '' }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          version=${TAG#v}
          dmgs=(dist/NeoSCAD-*.dmg)
          [[ ${#dmgs[@]} -eq 1 ]] || { echo "::error::expected one DMG in dist/, found ${dmgs[*]}"; exit 1; }
          # Cloned straight into Homebrew's tap directory, so `brew style`
          # and `brew install` below see the new cask as neoscad/tap's
          # (Homebrew refuses a cask file outside a tap). The token goes in
          # a per-command header rather than the remote URL, so it is not
          # left in the clone's config.
          auth=$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          header="http.https://github.com/.extraheader=AUTHORIZATION: basic $auth"
          tap="$(brew --repository)/Library/Taps/neoscad/homebrew-tap"
          rm -rf "$tap"
          git -c "$header" clone --quiet https://github.com/neoscad/homebrew-tap.git "$tap"
          scripts/release/fill-cask.sh "$version" "${dmgs[0]}" "$tap/Casks/neoscad-app.rb"
          brew style --cask neoscad/tap/neoscad-app

          # What a user runs, against the release's real download, before
          # anything is pushed (the tap is only ever given a cask that
          # installs): the checksum must match, and the installed
          # (quarantined) copy must pass Gatekeeper, which is what got
          # OpenSCAD's cask disabled.
          brew install --cask neoscad/tap/neoscad-app
          spctl -a -vv -t exec /Applications/NeoSCAD.app
          brew uninstall --cask neoscad-app

          cd "$tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/neoscad-app.rb
          if git diff --cached --quiet; then
            echo "Casks/neoscad-app.rb is already current"
          else
            git commit --quiet -m "neoscad-app $(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/neoscad-app.rb)"
            # The formula job pushes to the same tap at about the same
            # time; a push that loses that race is rebased and retried.
            for attempt in 1 2 3; do
              git -c "$header" push --quiet && break
              [[ $attempt -lt 3 ]] || exit 1
              sleep 10
              git -c "$header" pull --quiet --rebase
            done
          fi


      - name: Unsigned build
        if: env.HAVE_SIGNING != 'true'
        run: echo "::warning::No Developer ID secrets; the app was built ad-hoc signed and not uploaded."

      - name: Remove the keychain
        if: always() && env.HAVE_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/neoscad.keychain-db" || true
