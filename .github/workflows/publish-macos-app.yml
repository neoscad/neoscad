# The macOS app, first half: scripts/apple/release.sh builds, signs and
# smoke-tests the app and submits it for notarization without waiting;
# .github/workflows/macos-notarize.yml finishes it hours later (staples
# the app, makes and notarizes the DMG, attaches it, pushes the cask and
# promotes the release). docs/release.md, "The macOS app after the
# release", has the whole flow.
#
# Apple's notary queue took 75-80 minutes per submission for the new
# Developer ID, and twice a runner's network dropped while waiting, which
# failed the release. Nothing in the release waits on Apple now.
#
# This runs as one of release.yml's publish jobs (`publish-jobs` in
# Cargo.toml's [workspace.metadata.dist]), after cargo-dist's host job has
# created and published the GitHub Release, and before announce (which
# changes nothing on the release), because a release made with the
# workflow token cannot trigger a separate workflow.
#
# cargo-dist's own macOS signing is not used: it signs a bare binary, while
# the app needs its hardened-runtime entitlements, notarization and a
# stapled DMG, which release.sh already does and checks.
#
# Secrets (repository settings, all optional as a set; macos-notarize.yml
# needs the same ones):
#   NEOSCAD_DEVELOPER_ID_P12           base64 of the "Developer ID Application" .p12
#   NEOSCAD_DEVELOPER_ID_P12_PASSWORD  its password
#   NEOSCAD_SIGN_IDENTITY              the identity's name or SHA-1
#   NEOSCAD_TEAM_ID                    the Apple team id
#   NEOSCAD_NOTARY_KEY                 an App Store Connect API key (.p8 contents)
#   NEOSCAD_NOTARY_KEY_ID              its key id
#   NEOSCAD_NOTARY_ISSUER              its issuer id
# Without them the app is built ad-hoc signed and smoke-tested, and the
# release is left alone: an ad-hoc DMG fails Gatekeeper on every other Mac.
#
# workflow_dispatch runs the same build as a dry run: with the secrets it
# submits the app to Apple (a check of the submission), but records no
# state, so nothing finishes it.
name: macOS app

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # A full release stays a prerelease until its app is attached, so
  # `releases/latest` (and every link to /releases/latest/download/...)
  # stays on the last release that has one. cargo-dist's host job has
  # already published the release, and marked it latest, by the time any
  # publish job runs; this job is on Linux so it starts in seconds, which
  # is as short as that window can be made without editing release.yml.
  # macos-notarize.yml promotes it again. A prerelease tag (an rc) is a
  # prerelease already and stays one.
  hold:
    if: inputs.plan != '' && !fromJson(inputs.plan || '{}').announcement_is_prerelease
    runs-on: ubuntu-24.04
    env:
      HAVE_SIGNING: ${{ secrets.NEOSCAD_DEVELOPER_ID_P12 != '' && secrets.NEOSCAD_NOTARY_KEY != '' }}
    steps:
      - name: Hold the release as a prerelease
        # Without signing no app will come, and the release is complete
        # as it is.
        if: env.HAVE_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ fromJson(inputs.plan).announcement_tag }}
        run: |
          gh release edit "$TAG" --prerelease --repo "$GITHUB_REPOSITORY"
          # GitHub's docs say prereleases cannot be latest, but not what
          # becomes latest when the latest release turns into one; so name
          # it: the newest full release that is left.
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts \
            --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [[ -n "$previous" ]]; then
            gh release edit "$previous" --latest --repo "$GITHUB_REPOSITORY"
            echo "$TAG is a prerelease until its macOS app is attached; latest is $previous"
          else
            echo "$TAG is a prerelease until its macOS app is attached; there is no other full release"
          fi

  app:
    # macos-15's default Xcode (16.4) is too old for the app's Swift 6
    # concurrency checks; macos-26 has Xcode 26.6, the newest hosted one
    # (development uses Xcode 27, which hosted runners don't offer yet).
    # Pinned, so an image update can't change the toolchain unannounced.
    runs-on: macos-26
    # The build and one upload to Apple; nothing waits on the notary queue.
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HAVE_SIGNING: ${{ secrets.NEOSCAD_DEVELOPER_ID_P12 != '' && secrets.NEOSCAD_NOTARY_KEY != '' }}
      TAG: ${{ inputs.plan && fromJson(inputs.plan).announcement_tag || '' }}
      PRERELEASE: ${{ inputs.plan && fromJson(inputs.plan).announcement_is_prerelease || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # release.sh numbers the build with `git rev-list --count HEAD`.
          fetch-depth: 0

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen
          rustup show active-toolchain
          node --version

      - name: Signing keychain
        if: env.HAVE_SIGNING == 'true'
        env:
          P12: ${{ secrets.NEOSCAD_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.NEOSCAD_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NEOSCAD_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NEOSCAD_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NEOSCAD_NOTARY_ISSUER }}
        run: |
          kc="$RUNNER_TEMP/neoscad.keychain-db"
          kc_pass=$(uuidgen)
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          # The default keychain, so release.sh's `security find-identity`
          # and notarytool's --keychain-profile find what is stored here.
          security list-keychains -d user -s "$kc"
          security default-keychain -s "$kc"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" >/dev/null
          rm "$RUNNER_TEMP/id.p12"
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials neoscad-notary \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          rm "$RUNNER_TEMP/notary.p8"

      # Signed: build, smoke-test (from an unnotarized DMG of the same
      # app), and submit the app zip without waiting. The CLI is not
      # submitted: the release ships cargo-dist's archives, not release.sh's.
      - name: Build, sign, smoke-test, submit
        env:
          NEOSCAD_SIGN_IDENTITY: ${{ env.HAVE_SIGNING == 'true' && secrets.NEOSCAD_SIGN_IDENTITY || '' }}
          NEOSCAD_TEAM_ID: ${{ secrets.NEOSCAD_TEAM_ID }}
          NEOSCAD_NOTARY_PROFILE: ${{ env.HAVE_SIGNING == 'true' && 'neoscad-notary' || '' }}
        run: |
          if [[ "$HAVE_SIGNING" == true ]]; then
            scripts/apple/release.sh --no-wait
          else
            scripts/apple/release.sh
          fi

      # What macos-notarize.yml resumes from: the submitted zip (the exact
      # bytes Apple's ticket is for), its submission id, the dSYMs (they
      # match only this build and cannot be regenerated) and BUILDINFO.
      # 30 days is ample: the next stage normally takes it within hours.
      - name: Keep the submitted app
        if: env.HAVE_SIGNING == 'true' && env.TAG != ''
        uses: actions/upload-artifact@v7
        with:
          name: macos-app-${{ env.TAG }}
          path: |
            dist/NeoSCAD-*-app.zip
            dist/notary-app.id
            dist/NeoSCAD-*-dSYMs.zip
            dist/BUILDINFO.txt
          if-no-files-found: error
          retention-days: 30

      # The state record, a release asset because it must be readable and
      # rewritable by later runs of another workflow, which a workflow
      # artifact is not. Written last, so a record never names an
      # artifact that is not there yet. macos-notarize.yml deletes it once
      # the app is attached.
      - name: Record the pending notarization
        if: env.HAVE_SIGNING == 'true' && env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n --arg tag "$TAG" --argjson prerelease "$PRERELEASE" \
            --arg id "$(tr -d '[:space:]' < dist/notary-app.id)" \
            --arg run "$GITHUB_RUN_ID" --arg artifact "macos-app-$TAG" \
            --arg updated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{tag: $tag, prerelease: $prerelease, stage: "app-submitted",
              app_submission: $id, dmg_submission: null,
              artifact_run: $run, artifact: $artifact, updated: $updated}' \
            > "$RUNNER_TEMP/macos-app-state.json"
          cat "$RUNNER_TEMP/macos-app-state.json"
          gh release upload "$TAG" "$RUNNER_TEMP/macos-app-state.json" --clobber \
            --repo "$GITHUB_REPOSITORY"
          {
            echo "### macOS app submitted for notarization"
            echo "Submission \`$(cat dist/notary-app.id)\`. The scheduled **macOS notarization**"
            echo "workflow (macos-notarize.yml) staples it, notarizes the DMG, attaches it,"
            echo "pushes the cask and then promotes $TAG."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unsigned build
        if: env.HAVE_SIGNING != 'true'
        run: echo "::warning::No Developer ID secrets; the app was built ad-hoc signed and not uploaded."

      - name: Remove the keychain
        if: always() && env.HAVE_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/neoscad.keychain-db" || true
