# What a release adds beyond cargo-dist's archives and installers, once the
# GitHub Release exists (a cargo-dist publish job: `publish-jobs` in
# Cargo.toml's [workspace.metadata.dist]):
#
# - .deb and .rpm for Linux x86_64 and aarch64, wrapped by nfpm
#   (packaging/nfpm.yaml) around the release's own glibc 2.28 binaries,
#   with the man page and shell completions `neoscad generate` writes,
#   and installed and run in each supported distribution on both
#   architectures (the `smoke` job) before anything is attached;
# - the vendored-dependency source tarball (scripts/release/source-tarballs.sh);
#   cargo-dist already attaches the plain source.tar.gz;
# - filled package-manager manifests (scripts/release/fill-manifests.sh):
#   the AUR PKGBUILD, the Scoop manifest and the winget manifests, attached
#   for a maintainer to submit (nothing here pushes to those registries);
# - the ghcr.io/neoscad/neoscad image (packaging/docker/Dockerfile), for
#   linux/amd64 and linux/arm64.
name: Packages

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  NFPM_IMAGE: goreleaser/nfpm:v2.47.0

jobs:
  packages:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Release archives and checksums
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release" \
            --pattern '*.sha256' --pattern 'neoscad-cli-*-unknown-linux-gnu.tar.xz'

      - name: .deb and .rpm
        run: |
          mkdir -p "$RUNNER_TEMP/out/pkg"
          for pair in x86_64:amd64 aarch64:arm64; do
            triple=${pair%%:*}-unknown-linux-gnu
            arch=${pair##*:}
            work=$RUNNER_TEMP/nfpm-$arch
            mkdir -p "$work"
            tar -xJf "$RUNNER_TEMP/release/neoscad-cli-$triple.tar.xz" -C "$work"
            mv "$work/neoscad-cli-$triple" "$work/stage"
            cp packaging/nfpm.yaml "$work/"
          done
          # The man page and completions, from the x86_64 binary (the one
          # this runner can execute): they come from the clap definitions
          # alone, so the aarch64 packages get the same files.
          scripts/release/man-completions.sh "$RUNNER_TEMP/nfpm-amd64/stage/neoscad" "$RUNNER_TEMP/generated"
          for arch in amd64 arm64; do
            work=$RUNNER_TEMP/nfpm-$arch
            cp -R "$RUNNER_TEMP/generated/." "$work/stage/"
            for fmt in deb rpm; do
              docker run --rm -v "$work:/work" -v "$RUNNER_TEMP/out/pkg:/out" -w /work \
                -e NEOSCAD_VERSION="$VERSION" -e NEOSCAD_ARCH="$arch" \
                "$NFPM_IMAGE" package -f nfpm.yaml -p "$fmt" -t /out/
            done
          done
          cd "$RUNNER_TEMP/out/pkg"
          for f in *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done
          docker run --rm -v "$PWD:/out:ro" debian:bookworm-slim \
            sh -c 'for f in /out/*.deb; do dpkg-deb --info "$f"; dpkg-deb --contents "$f"; done'

      - name: Vendored source tarball
        run: scripts/release/source-tarballs.sh "$RUNNER_TEMP/out/source"

      - name: Package-manager manifests
        run: |
          scripts/release/fill-manifests.sh "$VERSION" "$RUNNER_TEMP/release" "$RUNNER_TEMP/manifests"
          (cd "$RUNNER_TEMP/manifests" && tar -czf "$RUNNER_TEMP/out/neoscad-package-manifests.tar.gz" ./*)

      # Attached only after the smoke tests pass (the `attach` job).
      - uses: actions/upload-artifact@v7
        with:
          name: neoscad-linux-packages
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          # Only a hand-off between this workflow's jobs; the release
          # keeps the files.
          retention-days: 7

  # Install each package in the distributions it claims to support, with
  # their package managers, and run it. One job per architecture, on a
  # runner that executes it natively (emulated, dnf alone takes minutes);
  # within a job the distributions run in parallel containers
  # (scripts/release/package-smoke.sh), which is faster than a job per
  # distribution, whose runner start-up would cost more than the test.
  smoke:
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: neoscad-linux-packages
          path: ${{ runner.temp }}/out
      - name: Install and run
        run: scripts/release/package-smoke.sh --arch "${{ matrix.arch }}" "$RUNNER_TEMP/out/pkg"

  attach:
    needs: [packages, smoke]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: neoscad-linux-packages
          path: ${{ runner.temp }}/out
      - name: Attach to the release
        run: |
          cd "$RUNNER_TEMP/out"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            pkg/*.deb pkg/*.rpm pkg/*.sha256 \
            "source/neoscad-${TAG#v}-vendor.tar.gz" \
            neoscad-package-manifests.tar.gz

  image:
    needs: packages
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
      PRERELEASE: ${{ fromJson(inputs.plan).announcement_is_prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          version=${TAG#v}
          tags=(-t "ghcr.io/neoscad/neoscad:$version")
          # `latest` is what a bare `docker pull ghcr.io/neoscad/neoscad`
          # gets, so a prerelease (published only when the release config's
          # `publish-prereleases` is set) must not move it off the last
          # stable release.
          if [[ "$PRERELEASE" != true ]]; then
            tags+=(-t ghcr.io/neoscad/neoscad:latest)
          fi
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f packaging/docker/Dockerfile --build-arg NEOSCAD_VERSION="$version" \
            "${tags[@]}" --push packaging/docker
