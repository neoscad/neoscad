# What a release adds beyond cargo-dist's archives and installers, once the
# GitHub Release exists (a cargo-dist publish job: `publish-jobs` in
# Cargo.toml's [workspace.metadata.dist]):
#
# - .deb and .rpm for Linux x86_64 and aarch64, wrapped by nfpm
#   (packaging/nfpm.yaml) around the release's own glibc 2.28 binaries,
#   with the man page and shell completions `neoscad generate` writes,
#   and installed and run in each supported distribution on both
#   architectures (the `smoke` job) before anything is attached;
# - the vendored-dependency source tarball (scripts/release/source-tarballs.sh);
#   cargo-dist already attaches the plain source.tar.gz;
# - filled package-manager manifests (scripts/release/fill-manifests.sh):
#   the AUR PKGBUILD and the Scoop manifest, attached for a maintainer to
#   submit; the Scoop manifest is also pushed to the
#   bucket neoscad/scoop-bucket (the `scoop` job, with the
#   SCOOP_BUCKET_TOKEN secret: a fine-grained token with Contents read and
#   write on that repository, which release.yml passes here through
#   `secrets: inherit`). Nothing here pushes to the AUR. The winget
#   manifests install the app's MSIs and need their ProductCodes, so
#   windows-installer.yml fills them after building the MSIs;
# - the ghcr.io/neoscad/neoscad image (packaging/docker/Dockerfile), for
#   linux/amd64 and linux/arm64;
# - the bench kit and the executables' checksums `neoscad bench` needs
#   (the `bench-kit` job), then the release baseline: the release's own
#   binaries benchmarked on four runners and committed to
#   neoscad/benchmarks (`baseline`, `baseline-submit`, with the
#   BENCHMARKS_TOKEN secret; docs/community-bench.md).
name: Packages

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  NFPM_IMAGE: goreleaser/nfpm:v2.47.0

jobs:
  packages:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Release archives and checksums
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release" \
            --pattern '*.sha256' --pattern 'neoscad-cli-*-unknown-linux-gnu.tar.xz'

      - name: .deb and .rpm
        run: |
          mkdir -p "$RUNNER_TEMP/out/pkg"
          for pair in x86_64:amd64 aarch64:arm64; do
            triple=${pair%%:*}-unknown-linux-gnu
            arch=${pair##*:}
            work=$RUNNER_TEMP/nfpm-$arch
            mkdir -p "$work"
            tar -xJf "$RUNNER_TEMP/release/neoscad-cli-$triple.tar.xz" -C "$work"
            mv "$work/neoscad-cli-$triple" "$work/stage"
            cp packaging/nfpm.yaml "$work/"
          done
          # The man page and completions, from the x86_64 binary (the one
          # this runner can execute): they come from the clap definitions
          # alone, so the aarch64 packages get the same files.
          scripts/release/man-completions.sh "$RUNNER_TEMP/nfpm-amd64/stage/neoscad" "$RUNNER_TEMP/generated"
          for arch in amd64 arm64; do
            work=$RUNNER_TEMP/nfpm-$arch
            cp -R "$RUNNER_TEMP/generated/." "$work/stage/"
            for fmt in deb rpm; do
              docker run --rm -v "$work:/work" -v "$RUNNER_TEMP/out/pkg:/out" -w /work \
                -e NEOSCAD_VERSION="$VERSION" -e NEOSCAD_ARCH="$arch" \
                "$NFPM_IMAGE" package -f nfpm.yaml -p "$fmt" -t /out/
            done
          done
          cd "$RUNNER_TEMP/out/pkg"
          for f in *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done
          docker run --rm -v "$PWD:/out:ro" debian:bookworm-slim \
            sh -c 'for f in /out/*.deb; do dpkg-deb --info "$f"; dpkg-deb --contents "$f"; done'

      - name: Vendored source tarball
        run: scripts/release/source-tarballs.sh "$RUNNER_TEMP/out/source"

      - name: Package-manager manifests
        run: |
          scripts/release/fill-manifests.sh "$VERSION" "$RUNNER_TEMP/release" "$RUNNER_TEMP/manifests"
          (cd "$RUNNER_TEMP/manifests" && tar -czf "$RUNNER_TEMP/out/neoscad-package-manifests.tar.gz" ./*)

      # Attached only after the smoke tests pass (the `attach` job).
      - uses: actions/upload-artifact@v7
        with:
          name: neoscad-linux-packages
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          # Only a hand-off between this workflow's jobs; the release
          # keeps the files.
          retention-days: 7

  # Install each package in the distributions it claims to support, with
  # their package managers, and run it. One job per architecture, on a
  # runner that executes it natively (emulated, dnf alone takes minutes);
  # within a job the distributions run in parallel containers
  # (scripts/release/package-smoke.sh), which is faster than a job per
  # distribution, whose runner start-up would cost more than the test.
  smoke:
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: neoscad-linux-packages
          path: ${{ runner.temp }}/out
      - name: Install and run
        run: scripts/release/package-smoke.sh --arch "${{ matrix.arch }}" "$RUNNER_TEMP/out/pkg"

  attach:
    needs: [packages, smoke]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: neoscad-linux-packages
          path: ${{ runner.temp }}/out
      - name: Attach to the release
        run: |
          cd "$RUNNER_TEMP/out"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            pkg/*.deb pkg/*.rpm pkg/*.sha256 \
            "source/neoscad-${TAG#v}-vendor.tar.gz" \
            neoscad-package-manifests.tar.gz

  # The filled Scoop manifest goes to the bucket, neoscad/scoop-bucket, as
  # bucket/neoscad.json. It needs only the `packages` job's manifest, not the
  # Linux smoke tests: it points at the Windows zips, which the `host` job
  # attached before this workflow started, so a Linux packaging failure
  # should not hold Windows users on an older version.
  #
  # A prerelease reaches here only when `publish-prereleases` is set (see
  # release.yml's `if` on this workflow), and then publishes too, as the
  # Homebrew formula and cask do: a bucket holds one manifest per app, and
  # Scoop has no prerelease channel.
  scoop:
    needs: packages
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
      BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: neoscad-linux-packages
          path: ${{ runner.temp }}/out
      - name: Push to neoscad/scoop-bucket
        run: |
          if [[ -z "$BUCKET_TOKEN" ]]; then
            echo "::warning::No SCOOP_BUCKET_TOKEN secret; the Scoop bucket was not updated."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/manifests"
          tar -xzf "$RUNNER_TEMP/out/neoscad-package-manifests.tar.gz" -C "$RUNNER_TEMP/manifests"
          manifest=$RUNNER_TEMP/manifests/neoscad.json
          # fill-manifests.sh leaves the Scoop manifest out, with a note,
          # when the release has no Windows archives: nothing to publish.
          if [[ ! -f "$manifest" ]]; then
            echo "::warning::No Scoop manifest in this release (no Windows archives); the bucket was not updated."
            exit 0
          fi
          # A manifest that doesn't parse, or names another version, would
          # break `scoop install` for everyone until the next release.
          jq -e --arg v "${TAG#v}" '.version == $v' "$manifest" >/dev/null \
            || { echo "::error::$manifest is not valid JSON for version ${TAG#v}"; exit 1; }

          # The token goes in a per-command header rather than the remote
          # URL, so it is not left in the clone's config.
          auth=$(printf 'x-access-token:%s' "$BUCKET_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          header="http.https://github.com/.extraheader=AUTHORIZATION: basic $auth"
          bucket=$RUNNER_TEMP/scoop-bucket
          git -c "$header" clone --quiet https://github.com/neoscad/scoop-bucket.git "$bucket"
          mkdir -p "$bucket/bucket"
          cp "$manifest" "$bucket/bucket/neoscad.json"

          cd "$bucket"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/neoscad.json
          if git diff --cached --quiet; then
            echo "bucket/neoscad.json is already current"
            exit 0
          fi
          git commit --quiet -m "neoscad ${TAG#v}"
          # Nothing else pushes to the bucket from a release, but a
          # maintainer's push can land in between; a push that loses that
          # race is rebased and retried.
          for attempt in 1 2 3; do
            git -c "$header" push --quiet && break
            [[ $attempt -lt 3 ]] || exit 1
            sleep 10
            git -c "$header" pull --quiet --rebase
          done

  image:
    needs: packages
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
      PRERELEASE: ${{ fromJson(inputs.plan).announcement_is_prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          version=${TAG#v}
          tags=(-t "ghcr.io/neoscad/neoscad:$version")
          # `latest` is what a bare `docker pull ghcr.io/neoscad/neoscad`
          # gets, so a prerelease (published only when the release config's
          # `publish-prereleases` is set) must not move it off the last
          # stable release.
          if [[ "$PRERELEASE" != true ]]; then
            tags+=(-t ghcr.io/neoscad/neoscad:latest)
          fi
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f packaging/docker/Dockerfile --build-arg NEOSCAD_VERSION="$version" \
            "${tags[@]}" --push packaging/docker

  # The bench kit `neoscad bench` times (scripts/release/bench-kit.sh:
  # conformance/bench.json's models, BOSL2 at its pinned commit, OpenSCAD's
  # examples at conformance/manifest.json's commit), and the SHA-256 of the
  # `neoscad` executable inside every archive, which a run compares its own
  # executable with to tell an official release binary from a self-built
  # one (crates/bench-core/src/official.rs). cargo-dist's checksums cannot
  # serve for that: they hash the archives. Attached at once rather than by
  # `attach`, since the baseline below needs both on the release and
  # neither depends on the Linux packages' smoke tests.
  bench-kit:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Reference checkout
        run: scripts/release/fetch-reference.sh

      - name: Kit
        run: scripts/release/bench-kit.sh --out "$RUNNER_TEMP/kit"

      - name: Executable checksums
        run: |
          archives=$RUNNER_TEMP/archives
          mkdir -p "$archives"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$archives" \
            --pattern 'neoscad-cli-*.tar.xz' --pattern 'neoscad-cli-*.zip' --pattern 'neoscad-cli-*.sha256'
          sums=$RUNNER_TEMP/kit/neoscad-executables.sha256sums
          : >"$sums"
          cd "$archives"
          for a in neoscad-cli-*.tar.xz neoscad-cli-*.zip; do
            [[ -f "$a" ]] || continue
            # Each archive is first checked against cargo-dist's own
            # checksum ("HASH *NAME"), so the list vouches for what the
            # release publishes and nothing else.
            [[ "$(sha256sum "$a" | cut -d' ' -f1)" == "$(cut -d' ' -f1 "$a.sha256")" ]] \
              || { echo "::error::$a does not match $a.sha256"; exit 1; }
            triple=${a#neoscad-cli-}
            triple=${triple%.tar.xz}
            triple=${triple%.zip}
            dir=$RUNNER_TEMP/unpacked/$triple
            mkdir -p "$dir"
            case "$a" in
              *.zip) unzip -q "$a" -d "$dir" ;;
              *) tar -xJf "$a" -C "$dir" ;;
            esac
            exe=$(find "$dir" -type f \( -name neoscad -o -name neoscad.exe \) | head -n 1)
            [[ -n "$exe" ]] || { echo "::error::no neoscad executable in $a"; exit 1; }
            echo "$(sha256sum "$exe" | cut -d' ' -f1)  $triple/$(basename "$exe")" >>"$sums"
          done
          LC_ALL=C sort -k2 -o "$sums" "$sums"
          cat "$sums"
          [[ -s "$sums" ]] || { echo "::error::no archives on the release"; exit 1; }

      - name: Attach to the release
        run: |
          cd "$RUNNER_TEMP/kit"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            neoscad-bench-kit-*.tar.gz neoscad-bench-kit-*.tar.gz.sha256 neoscad-executables.sha256sums

  # The release baseline: the release's own binaries, downloaded from the
  # release like anyone's, timed on the kit on GitHub's runners (no
  # OpenSCAD), so every version shown on neoscad.org has a result from the
  # same four machine types. A failure here must not fail the release
  # (release.yml's `announce` waits for this workflow), hence
  # continue-on-error.
  baseline:
    needs: bench-kit
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Release binary and kit
        run: |
          version=${TAG#v}
          case "$TARGET" in
            *windows*) archive=neoscad-cli-$TARGET.zip ;;
            *) archive=neoscad-cli-$TARGET.tar.xz ;;
          esac
          kit=neoscad-bench-kit-$version.tar.gz
          dl=$RUNNER_TEMP/dl
          mkdir -p "$dl/bin"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$dl" \
            --pattern "$archive" --pattern "$archive.sha256" --pattern "$kit" --pattern "$kit.sha256"
          cd "$dl"
          sum() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d' ' -f1; }
          for f in "$archive" "$kit"; do
            [[ "$(sum "$f")" == "$(cut -d' ' -f1 "$f.sha256")" ]] \
              || { echo "::error::$f does not match $f.sha256"; exit 1; }
          done
          case "$archive" in
            *.zip) (cd bin && pwsh -NoProfile -Command "Expand-Archive -LiteralPath ../$archive -DestinationPath .") ;;
            *) tar -xJf "$archive" -C bin ;;
          esac
          exe=$(find "$dl/bin" -type f \( -name neoscad -o -name neoscad.exe \) | head -n 1)
          [[ -n "$exe" ]] || { echo "::error::no neoscad executable in $archive"; exit 1; }
          echo "NEOSCAD=$exe" >>"$GITHUB_ENV"
          echo "KIT=$dl/$kit" >>"$GITHUB_ENV"

      # The binary checks itself against the release's
      # neoscad-executables.sha256sums, as a user's run does; a baseline
      # that is not `official` is not submitted.
      - name: Bench
        run: |
          "$NEOSCAD" bench --no-openscad --source ci-baseline --kit "$KIT" \
            --json "$RUNNER_TEMP/ci-baseline-$TARGET.json"
          jq -e '.neoscad.official' "$RUNNER_TEMP/ci-baseline-$TARGET.json" >/dev/null \
            || { echo "::error::the release binary did not verify as official"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: bench-baseline-${{ matrix.target }}
          path: ${{ runner.temp }}/ci-baseline-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 7

  # The baselines go to neoscad/benchmarks as results/<version>/
  # ci-baseline-<target>.json, committed directly (issues are for users'
  # results), with the BENCHMARKS_TOKEN secret: a fine-grained token with
  # Contents read and write on neoscad/benchmarks only, which release.yml
  # passes here through `secrets: inherit`. Without it, or when no baseline
  # finished, the job warns and skips. Whatever baselines finished are
  # committed: one runner's failure should not withhold the others.
  baseline-submit:
    needs: baseline
    if: ${{ !cancelled() }}
    continue-on-error: true
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
      BENCHMARKS_TOKEN: ${{ secrets.BENCHMARKS_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bench-baseline-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      - name: Commit to neoscad/benchmarks
        run: |
          if [[ -z "$BENCHMARKS_TOKEN" ]]; then
            echo "::warning::No BENCHMARKS_TOKEN secret; the release baseline was not submitted to neoscad/benchmarks."
            exit 0
          fi
          version=${TAG#v}
          shopt -s nullglob
          results=("$RUNNER_TEMP"/results/ci-baseline-*.json)
          if [[ ${#results[@]} -eq 0 ]]; then
            echo "::warning::No baseline finished; nothing to submit."
            exit 0
          fi
          auth=$(printf 'x-access-token:%s' "$BENCHMARKS_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          header="http.https://github.com/.extraheader=AUTHORIZATION: basic $auth"
          repo=$RUNNER_TEMP/benchmarks
          git -c "$header" clone --quiet --depth 1 https://github.com/neoscad/benchmarks.git "$repo"
          mkdir -p "$repo/results/$version"
          for f in "${results[@]}"; do
            # Only what the workflow itself measured: schema 1, this
            # version, an official binary, marked ci-baseline.
            jq -e --arg v "$version" \
              '.schema == 1 and .source == "ci-baseline" and .neoscad.version == $v and .neoscad.official' \
              "$f" >/dev/null || { echo "::warning::$(basename "$f") is not a valid baseline; skipped"; continue; }
            cp "$f" "$repo/results/$version/"
          done
          cd "$repo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "results/$version is already current"
            exit 0
          fi
          git commit --quiet -m "neoscad $version: release baseline"
          for attempt in 1 2 3; do
            git -c "$header" push --quiet && break
            [[ $attempt -lt 3 ]] || exit 1
            sleep 10
            git -c "$header" pull --quiet --rebase
          done
