# The Windows app (windows/, docs/windows-app.md), milestone 1: builds the
# core's DLL and the C# binding (scripts/windows/build-core.ps1), runs the
# host-logic and binding tests, builds the WinUI app, launches it on one
# of the core's examples and uploads a screenshot of its window and its
# diagnostic log (scripts/windows/launch-screenshot.ps1) for a person to
# look at.
#
# Runs only when something the app is built from changes, and on demand.
name: Windows app

on:
  pull_request:
    paths:
      - "windows/**"
      - "crates/ffi/**"
      - "crates/client/**"
      - "apple/Editor/web/**"
      - "scripts/windows/**"
      - ".github/workflows/windows-app.yml"
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "crates/ffi/**"
      - "crates/client/**"
      - "apple/Editor/web/**"
      - "scripts/windows/**"
      - ".github/workflows/windows-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-app-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  app:
    name: app (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            platform: x64
          - arch: arm64
            runner: windows-11-arm
            platform: ARM64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-app-${{ matrix.arch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: The core's DLL, the C# binding and the editor bundle
        shell: pwsh
        run: scripts/windows/build-core.ps1 -Arch ${{ matrix.arch }}

      - name: Host logic and binding tests (against the real core)
        shell: pwsh
        run: dotnet test windows/NeoSCAD.Tests/NeoSCAD.Tests.csproj -c Release -p:NeoScadRid=win-${{ matrix.arch }}

      - name: Build the app
        shell: pwsh
        run: >
          dotnet build windows/NeoSCAD.App/NeoSCAD.App.csproj -c Release
          -r win-${{ matrix.arch }} -p:Platform=${{ matrix.platform }}
          -p:NeoScadRid=win-${{ matrix.arch }}

      # Launch on the default example with the diagnostic log on, check it
      # is still running after 25 s (it did not crash on start), photograph
      # its window alone (PrintWindow, so a console or the first-run privacy
      # screen on top does not hide it) and close it. The screenshot and the
      # log are for people: nothing here checks what they show.
      - name: Launch, log and screenshot
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter NeoSCAD.exe windows/NeoSCAD.App/bin/${{ matrix.platform }}/Release |
            Select-Object -First 1
          if (-not $exe) { throw "no NeoSCAD.exe was built" }
          scripts/windows/launch-screenshot.ps1 -Exe $exe.FullName -Out screenshots `
            -Name neoscad-windows-${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: neoscad-windows-${{ matrix.arch }}-screenshot
          path: screenshots/
          if-no-files-found: warn
