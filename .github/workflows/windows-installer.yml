# The Windows app's MSI (windows/installer/NeoSCAD.wxs,
# scripts/windows/build-msi.ps1; docs/windows-app.md, "Installer"), built
# and then tested the way a user meets it, on each architecture's own
# runner:
#
#   1. check the Windows scripts (scripts/windows/test-scripts.ps1: they
#      parse, and the licence page's RTF holds what it must);
#   2. build the core, the binding and the editor bundle, publish the app
#      self-contained and build the unsigned MSI; upload it as an artifact;
#   3. install it silently (msiexec /qn) and check the files, the Start
#      menu shortcut, the Add or remove programs entry and the .scad
#      association in the registry;
#   4. launch the installed exe with --log and screenshot its window
#      (scripts/windows/launch-screenshot.ps1), then open a .scad file the
#      way Explorer does (ShellExecute) and check the installed exe got it;
#   5. uninstall silently and check that the files and keys are gone;
#   6. in a release only: attest the MSI and attach it, with its .sha256,
#      to the GitHub Release;
#   7. in a release only, once both MSIs are attached: fill the winget
#      manifests from them and attach neoscad-winget-manifests.tar.gz
#      (the `winget` job).
#
# It runs as one of release.yml's publish jobs (`publish-jobs` in
# Cargo.toml's [workspace.metadata.dist]; docs/release.md, "The
# cross-platform release"), after the release exists and before it is
# announced; so for a prerelease only when `publish-prereleases` is set,
# like the other publish jobs. Only an MSI that passed steps 3 to 5 is
# attached. workflow_dispatch runs the same build and tests as a dry run:
# the MSIs are workflow artifacts, and nothing is attested or attached.
name: Windows installer

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch: {}

permissions:
  contents: write
  # For the MSIs' GitHub artifact attestations (the "Attest" step below);
  # release.yml grants them to this job through Cargo.toml's
  # github-custom-job-permissions.
  id-token: write
  attestations: write

# A dispatched run replaces an earlier dispatched run of the same commit,
# but a release's run is never cancelled, least of all by a dispatch made
# while it runs: the event name keeps them in separate groups (called from
# release.yml, github.event_name is the release's own `push`).
concurrency:
  group: windows-installer-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  msi:
    name: msi (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-app-${{ matrix.arch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Check the Windows scripts and the licence page
        shell: pwsh
        run: scripts/windows/test-scripts.ps1

      - name: The core's DLL, the C# binding and the editor bundle
        shell: pwsh
        run: scripts/windows/build-core.ps1 -Arch ${{ matrix.arch }}

      - name: Build the MSI
        id: build
        shell: pwsh
        run: scripts/windows/build-msi.ps1 -Arch ${{ matrix.arch }} -Out dist/windows

      - uses: actions/upload-artifact@v7
        with:
          name: neoscad-windows-${{ matrix.arch }}-msi
          # With the licence page's RTF, to read what the installer shows.
          path: |
            dist/windows/*.msi
            dist/windows/License.rtf
          if-no-files-found: error

      - name: Install silently
        shell: pwsh
        env:
          MSI: ${{ steps.build.outputs.msi }}
        run: |
          New-Item -ItemType Directory -Force -Path installer-test | Out-Null
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i', "`"$env:MSI`"", '/qn', '/norestart', '/l*v', "`"$PWD\installer-test\install.log`""
          if ($p.ExitCode -ne 0) { throw "msiexec /i exited $($p.ExitCode) (installer-test/install.log)" }

      # Everything a user would see of the install, checked by name. The
      # version is the workspace version's numeric part, as build-msi.ps1
      # gives the MSI and Directory.Build.props the exe.
      - name: Check the install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cargo = Get-Content -Raw Cargo.toml
          $version = [regex]::Match($cargo, '(?<=\[workspace\.package\]\s*\nversion\s*=\s*")[^"]+').Value
          $numeric = [regex]::Match($version, '^\d+\.\d+\.\d+').Value
          $dir = Join-Path $env:ProgramFiles 'NeoSCAD'
          $exe = Join-Path $dir 'NeoSCAD.exe'
          $cli = Join-Path $dir 'bin\neoscad.exe'
          foreach ($f in $exe, $cli, "$dir\Editor\editor.html", "$dir\Assets\NeoSCAD.ico", "$dir\LICENSE", "$dir\NOTICE",
                         "$dir\licenses\README.md", "$dir\licenses\third-party\README.txt") {
            if (-not (Test-Path $f)) { throw "missing after install: $f" }
          }
          # The bundled CLI, which agent clients start by its absolute path
          # (docs/mcp.md, "Setup from the apps"): it runs from the install,
          # serves MCP on stdio, and is not on PATH.
          $cliVersion = & $cli --version
          if ($cliVersion -ne "neoscad $version") { throw "bin\neoscad.exe says '$cliVersion', expected 'neoscad $version'" }
          $initialize = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"installer-test","version":"0"}}}'
          $reply = ($initialize | & $cli mcp | Select-Object -First 1)
          if ($reply -notmatch '"serverInfo"') { throw "bin\neoscad.exe mcp did not answer initialize: $reply" }
          Write-Host "bundled CLI: $cliVersion; mcp initialize answered"
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if ($machinePath -split ';' | Where-Object { $_.TrimEnd('\') -like "$dir*" }) { throw "the install put $dir on PATH" }
          $fileVersion = (Get-Item $exe).VersionInfo.FileVersion
          if ($fileVersion -ne "$numeric.0") { throw "NeoSCAD.exe's file version is $fileVersion, expected $numeric.0" }
          Get-Content "$dir\licenses\third-party\README.txt" | Write-Host

          $shortcut = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\NeoSCAD.lnk'
          if (-not (Test-Path $shortcut)) { throw "no Start menu shortcut at $shortcut" }

          $arp = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall' |
            Get-ItemProperty -ErrorAction SilentlyContinue | Where-Object { $_.PSObject.Properties.Name -contains 'DisplayName' -and $_.DisplayName -eq 'NeoSCAD' }
          if (@($arp).Count -ne 1) { throw "expected one 'NeoSCAD' uninstall entry, found $(@($arp).Count)" }
          if ($arp.DisplayVersion -ne $numeric) { throw "uninstall entry's version is $($arp.DisplayVersion), expected $numeric" }
          # ARPPRODUCTICON is not written to the uninstall key as DisplayIcon:
          # Windows Installer keeps it as the product's ProductIcon under
          # Installer\Products, which is where Add or remove programs reads it.
          $product = Get-ChildItem 'HKLM:\SOFTWARE\Classes\Installer\Products' |
            Get-ItemProperty -ErrorAction SilentlyContinue | Where-Object { $_.ProductName -eq 'NeoSCAD' }
          if (@($product).Count -ne 1) { throw "expected one 'NeoSCAD' product under Installer\Products, found $(@($product).Count)" }
          if (-not $product.ProductIcon) { throw "the product has no ProductIcon (ARPPRODUCTICON)" }
          Write-Host "uninstall entry: $($arp.PSChildName) $($arp.DisplayVersion), icon $($product.ProductIcon)"

          $classes = 'HKLM:\SOFTWARE\Classes'
          $expect = @{
            '.scad' = 'NeoSCAD.scad'
            'NeoSCAD.scad' = 'OpenSCAD model'
            'NeoSCAD.scad\DefaultIcon' = "$exe,0"
            'NeoSCAD.scad\shell\open\command' = "`"$exe`" `"%1`""
          }
          foreach ($key in $expect.Keys) {
            $value = (Get-Item -LiteralPath "$classes\$key").GetValue('')
            if ($value -ne $expect[$key]) { throw "$key is '$value', expected '$($expect[$key])'" }
            Write-Host "$key = $value"
          }
          $progids = Get-Item -LiteralPath "$classes\.scad\OpenWithProgids"
          if ($progids.GetValueNames() -notcontains 'NeoSCAD.scad') { throw ".scad\OpenWithProgids lacks NeoSCAD.scad" }
          $types = Get-Item -LiteralPath "$classes\Applications\NeoSCAD.exe\SupportedTypes"
          if ($types.GetValueNames() -notcontains '.scad') { throw "Applications\NeoSCAD.exe\SupportedTypes lacks .scad" }

      - name: Launch the installed app, log and screenshot
        shell: pwsh
        run: |
          scripts/windows/launch-screenshot.ps1 -Exe "$env:ProgramFiles\NeoSCAD\NeoSCAD.exe" -Out installer-test `
            -Name neoscad-windows-${{ matrix.arch }}-installed

      # What a double-click in Explorer does: ShellExecute on the file,
      # which follows .scad to the ProgId's open command. The installed exe
      # must start with the file's path as its argument.
      - name: Open a .scad file through the association
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $model = Join-Path $env:RUNNER_TEMP 'association test.scad'
          Set-Content -Path $model -Value 'cube(10);'
          Start-Process -FilePath $model
          $exe = Join-Path $env:ProgramFiles 'NeoSCAD\NeoSCAD.exe'
          $found = $null
          foreach ($i in 1..40) {
            $found = Get-CimInstance Win32_Process -Filter "Name = 'NeoSCAD.exe'" |
              Where-Object { $_.ExecutablePath -eq $exe -and $_.CommandLine -like "*$model*" }
            if ($found) { break }
            Start-Sleep -Milliseconds 250
          }
          if (-not $found) { throw "opening $model did not start $exe with it" }
          Write-Host "started: $($found.CommandLine)"
          Start-Sleep -Seconds 5
          $found | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }

      - name: Uninstall silently, and check it is gone
        shell: pwsh
        env:
          MSI: ${{ steps.build.outputs.msi }}
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Process NeoSCAD -ErrorAction SilentlyContinue | Stop-Process -Force
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/x', "`"$env:MSI`"", '/qn', '/norestart', '/l*v', "`"$PWD\installer-test\uninstall.log`""
          if ($p.ExitCode -ne 0) { throw "msiexec /x exited $($p.ExitCode) (installer-test/uninstall.log)" }
          $left = @()
          $dir = Join-Path $env:ProgramFiles 'NeoSCAD'
          if (Test-Path $dir) { $left += "${dir}: $((Get-ChildItem -Recurse $dir | Select-Object -First 10 -ExpandProperty FullName) -join ', ')" }
          $shortcut = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\NeoSCAD.lnk'
          if (Test-Path $shortcut) { $left += $shortcut }
          $classes = 'HKLM:\SOFTWARE\Classes'
          foreach ($key in 'NeoSCAD.scad', 'Applications\NeoSCAD.exe') {
            if (Test-Path -LiteralPath "$classes\$key") { $left += "$classes\$key" }
          }
          if (Test-Path -LiteralPath "$classes\.scad") {
            $scad = Get-Item -LiteralPath "$classes\.scad"
            if ($scad.GetValue('') -eq 'NeoSCAD.scad') { $left += '.scad default = NeoSCAD.scad' }
            if (Test-Path -LiteralPath "$classes\.scad\OpenWithProgids") {
              if ((Get-Item -LiteralPath "$classes\.scad\OpenWithProgids").GetValueNames() -contains 'NeoSCAD.scad') {
                $left += '.scad\OpenWithProgids\NeoSCAD.scad'
              }
            }
          }
          $arp = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall' |
            Get-ItemProperty -ErrorAction SilentlyContinue | Where-Object { $_.PSObject.Properties.Name -contains 'DisplayName' -and $_.DisplayName -eq 'NeoSCAD' }
          if ($arp) { $left += "uninstall entry $($arp.PSChildName)" }
          if ($left) { throw "left after uninstall:`n$($left -join "`n")" }
          Write-Host "uninstalled: no files, shortcut, registry keys or uninstall entry left"

      # A GitHub artifact attestation (build provenance) for the MSI, as
      # cargo-dist's "Attest" step gives the archives and
      # publish-macos-app.yml the DMG: `gh attestation verify <file>
      # -R neoscad/neoscad`. The MSI is unsigned (docs/release.md, "Windows
      # is unsigned"), so this and the checksum are how a user checks it.
      # These two steps come after the uninstall check, so only an MSI
      # that passed every step above is attested and attached.
      - name: Attest
        if: inputs.plan != ''
        uses: actions/attest@v4
        with:
          subject-path: dist/windows/*.msi

      - name: Attach to the release
        if: inputs.plan != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.plan && fromJson(inputs.plan).announcement_tag || '' }}
          ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = @(Get-Item dist/windows/*.msi)
          if ($msi.Count -ne 1) { throw "expected one MSI in dist/windows, found $($msi.Count)" }
          $msi = $msi[0]
          # The name carries the workspace version, which is the tag's
          # without its v; a mismatch means the tag and Cargo.toml disagree.
          $expected = "NeoSCAD-$($env:TAG.TrimStart('v'))-windows-${env:ARCH}.msi"
          if ($msi.Name -ne $expected) { throw "$($msi.Name) is not $expected (tag $env:TAG)" }
          # `sha256sum` format with an LF, as cargo-dist's .sha256 beside
          # each archive, so `sha256sum -c` checks it on any platform.
          $sum = "$($msi.FullName).sha256"
          $hash = (Get-FileHash -Algorithm SHA256 $msi.FullName).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText($sum, "$hash  $($msi.Name)`n", [System.Text.Encoding]::ASCII)
          # --clobber: re-running a failed release's job replaces what an
          # earlier attempt attached, rather than failing on it.
          gh release upload $env:TAG $msi.FullName $sum --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed ($LASTEXITCODE)" }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: neoscad-windows-${{ matrix.arch }}-installer-test
          path: installer-test/
          if-no-files-found: warn

  # The winget manifests for NeoSCAD.NeoSCAD, which installs these MSIs.
  # They need each MSI's ProductCode, which WiX makes anew in every build,
  # so they can only be filled once both MSIs exist; publish-packages.yml,
  # which fills the other manifests, runs alongside this workflow and
  # cannot wait for them. The MSIs are read back from the release, so the
  # manifests describe exactly the files a user downloads. Attached as
  # neoscad-winget-manifests.tar.gz for a maintainer to submit to
  # microsoft/winget-pkgs (docs/packaging.md); nothing here submits it.
  winget:
    needs: msi
    if: inputs.plan != ''
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.plan && fromJson(inputs.plan).announcement_tag || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # msiinfo, which reads the MSIs' Property tables.
      - name: msitools
        run: sudo apt-get update -q && sudo apt-get install -y -q msitools
      - name: Fill and attach
        run: |
          msis=$RUNNER_TEMP/msi
          out=$RUNNER_TEMP/winget
          mkdir -p "$msis" "$out"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$msis" \
            --pattern 'NeoSCAD-*-windows-*.msi' --pattern 'NeoSCAD-*-windows-*.msi.sha256'
          scripts/release/fill-manifests.sh --winget "${TAG#v}" "$msis" "$out"
          cat "$out"/*.yaml
          tar -czf "$RUNNER_TEMP/neoscad-winget-manifests.tar.gz" -C "$out" .
          gh release upload "$TAG" "$RUNNER_TEMP/neoscad-winget-manifests.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"
