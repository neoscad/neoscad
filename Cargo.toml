[workspace]
resolver = "3"
members = ["crates/*"]
# A patched copy of a dependency, not a member (see vendor/README.md).
exclude = ["vendor"]

[workspace.package]
# The release rehearsal: tag v0.1.0-rc.1 runs every release job for real.
# Back to "0.1.0" (with `publish-prereleases` below) for the release.
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.98"
license = "GPL-2.0-or-later"
repository = "https://github.com/neoscad/neoscad"
homepage = "https://neoscad.org"
# The MSI's manufacturer and the Homebrew formula's credit come from here.
authors = ["The NeoSCAD contributors"]

[workspace.dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
# The global allocator of the native binaries and the app's core (crates/cli,
# crates/ffi; never wasm32). Pinned exactly: it builds mimalloc's C sources
# (libmimalloc-sys, mimalloc 3.x) with `cc`, the one C dependency outside
# the system frameworks (docs/architecture.md, "Stack").
mimalloc = { version = "=0.1.52", default-features = false }
png = "0.18"
rayon = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-script = "0.5"

# manifold-rust with a fix for an edge-collapse bug that fills concave
# corners after a union, and clipper2-rust with a faster rounding function
# (see vendor/README.md).
[patch.crates-io]
manifold-rust = { path = "vendor/manifold-rust" }
clipper2-rust = { path = "vendor/clipper2-rust" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

# The conformance suite runs hundreds of neoscad processes per pass, and the
# CLI's cold start is itself a tracked benchmark, so release builds favour
# runtime speed over build time.
#
# Panics unwind (Cargo cannot set `panic` per binary): `neoscad serve`
# answers a request that panics with a JSON-RPC internal error and keeps
# serving, which `abort` made impossible (one bad request ended the server
# and every client's warm caches). The cost, measured A/B against `abort`
# (`docs/audits/unwind.md`, `docs/architecture.md` "Panics"): nothing at
# cold start, about 1% on geometry-bound runs, 5-9% on evaluation-bound
# BOSL2 models after D1, up to 12% on call-heavy code. The unwind
# `neoscad` binary is 18.8 MB (18,785,336 bytes, September 2026).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"

# The browser demo's wasm32 core (`scripts/web/build-core.sh`, crates/web).
# Size is download time there, so no debug info (37.6 MB of a 48.6 MB
# release module was DWARF), symbols stripped and whole-program LTO.
# Panics abort: wasm32-unknown-unknown cannot unwind, so a panic traps the
# instance either way, and the page respawns the worker
# (docs/web-protocol.md, "Crashes, cancelling and respawning"); `abort`
# also drops the unwinding tables.
[profile.web]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true

# Full debug info made `target/debug` about 21 GB and filled the disk. Line
# tables still give file:line backtraces; dependencies carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Release artifacts (cargo-dist): the release profile without the line
# tables, which made the Linux binary 87 MB; function names stay, so a
# panic's backtrace still names the functions. The macOS app and its CLI
# tarball keep full symbols in dSYMs instead (scripts/apple/release.sh).
[profile.dist]
inherits = "release"
strip = "debuginfo"

# cargo-dist builds and publishes `neoscad` (crates/cli, the only package
# with `dist = true`) for six targets: archives with sha256 files, shell
# and PowerShell installers, an MSI, and a Homebrew formula pushed to the
# neoscad/homebrew-tap repository. `dist generate` writes
# .github/workflows/release.yml from this table: edit here, not there.
# Every job takes its toolchain from rust-toolchain.toml.
[workspace.metadata.dist]
cargo-dist-version = "0.33.0"
ci = "github"
dist = false
precise-builds = true
# Windows builds (the zips and MSIs) ship unsigned: no paid Authenticode
# (owner decision 2026-09-29). Checksums and GitHub artifact attestations
# let users verify them; see docs/release.md, "Windows is unsigned".
installers = ["shell", "powershell", "homebrew", "msi"]
tap = "neoscad/homebrew-tap"
formula = "neoscad"
# Once the release exists: the signed app DMG
# (.github/workflows/publish-macos-app.yml), and the .deb/.rpm, vendored
# source, filled package manifests and ghcr.io image
# (.github/workflows/publish-packages.yml).
publish-jobs = ["homebrew", "./publish-macos-app", "./publish-packages"]
# For the v0.1.0-rc.1 rehearsal only: cargo-dist skips every publish job
# (the tap's formula, the DMG, the packages and the image) for a
# prerelease tag unless this is set, and the rehearsal exists to run them.
# Remove it for v0.1.0: Homebrew has no prerelease channel, so with it set
# any later prerelease tag would replace the tap's stable `neoscad` formula.
publish-prereleases = true
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
]
install-path = "CARGO_HOME"
# A release builds nothing until CI (tests and conformance on every
# platform) passes on the tagged commit. Pull requests run CI directly,
# which also checks this config (`dist generate --check`, `dist plan`), so
# release.yml itself skips them rather than running every test twice.
plan-jobs = ["./ci"]
pr-run-mode = "skip"
github-attestations = true
# LICENSE, NOTICE and the licences of what the binary embeds
# (scripts/release/licenses.sh), named explicitly so the archive layout
# does not depend on auto-detection.
auto-includes = false
include = ["LICENSE", "NOTICE", "packaging/licenses/"]
# crates/cli/wix/main.wxs carries hand-added licence files (see there), so
# `dist generate` must not rewrite it.
allow-dirty = ["msi"]

# Linux binaries are built in manylinux_2_28 containers so they run on
# glibc 2.28 and later (Debian 10, RHEL 8); built on the runner's Ubuntu
# 22.04 they would need glibc 2.35. `host` is what dist itself runs as
# inside the container (its static musl build).
[workspace.metadata.dist.github-custom-runners]
global = "ubuntu-22.04"
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15"
x86_64-pc-windows-msvc = "windows-2025"
aarch64-pc-windows-msvc = "windows-11-arm"

[workspace.metadata.dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-22.04"
container = { image = "quay.io/pypa/manylinux_2_28_x86_64", host = "x86_64-unknown-linux-musl" }

[workspace.metadata.dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-22.04-arm"
container = { image = "quay.io/pypa/manylinux_2_28_aarch64", host = "aarch64-unknown-linux-musl" }

[workspace.metadata.dist.github-custom-job-permissions]
publish-macos-app = { contents = "write" }
publish-packages = { contents = "write", packages = "write" }

[workspace.metadata.dist.min-glibc-version]
"*" = "2.28"
