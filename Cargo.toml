[workspace]
resolver = "3"
members = ["crates/*"]
# A patched copy of a dependency, not a member (see vendor/README.md).
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-2.0-or-later"

[workspace.dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
# The global allocator of the native binaries and the app's core (crates/cli,
# crates/ffi; never wasm32). Pinned exactly: it builds mimalloc's C sources
# (libmimalloc-sys, mimalloc 3.x) with `cc`, the one C dependency outside
# the system frameworks (docs/architecture.md, "Stack").
mimalloc = { version = "=0.1.52", default-features = false }
png = "0.18"
rayon = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-script = "0.5"

# manifold-rust with a fix for an edge-collapse bug that fills concave
# corners after a union, and clipper2-rust with a faster rounding function
# (see vendor/README.md).
[patch.crates-io]
manifold-rust = { path = "vendor/manifold-rust" }
clipper2-rust = { path = "vendor/clipper2-rust" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

# The conformance suite runs hundreds of neoscad processes per pass, and the
# CLI's cold start is itself a tracked benchmark, so release builds favour
# runtime speed over build time.
#
# Panics unwind (Cargo cannot set `panic` per binary): `neoscad serve`
# answers a request that panics with a JSON-RPC internal error and keeps
# serving, which `abort` made impossible (one bad request ended the server
# and every client's warm caches). The cost, measured A/B against `abort`
# (`docs/audits/unwind.md`, `docs/architecture.md` "Panics"): nothing at
# cold start, about 1% on geometry-bound runs, 5-9% on evaluation-bound
# BOSL2 models after D1, up to 12% on call-heavy code. The unwind
# `neoscad` binary is 18.8 MB (18,785,336 bytes, September 2026).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"

# Full debug info made `target/debug` about 21 GB and filled the disk. Line
# tables still give file:line backtraces; dependencies carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
