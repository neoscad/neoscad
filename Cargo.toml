[workspace]
resolver = "3"
members = ["crates/*"]
# A patched copy of a dependency, not a member (see vendor/README.md).
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-2.0-or-later"

[workspace.dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
png = "0.18"
rayon = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-script = "0.5"

# manifold-rust with a fix for an edge-collapse bug that fills concave
# corners after a union (see vendor/README.md).
[patch.crates-io]
manifold-rust = { path = "vendor/manifold-rust" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

# The conformance suite runs hundreds of neoscad processes per pass, and the
# CLI's cold start is itself a tracked benchmark, so release builds favour
# runtime speed over build time.
#
# Panics unwind (Cargo cannot set `panic` per binary): `neoscad serve`
# answers a request that panics with a JSON-RPC internal error and keeps
# serving, which `abort` made impossible (one bad request ended the server
# and every client's warm caches). Measured against `abort` in phase 7b
# (best of 5, `conformance bench`): cold start 4.2 -> 4.3 ms, geometry-bound
# models unchanged, evaluation-bound BOSL2 models 5-8% slower
# (fractal_tree 5.87 -> 6.33 s), binary 14.9 -> 17.0 MB.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"

# Full debug info made `target/debug` about 21 GB and filled the disk. Line
# tables still give file:line backtraces; dependencies carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
