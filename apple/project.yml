# The macOS app's project, for XcodeGen (docs/architecture.md, "Apps").
# `xcodegen generate --spec apple/project.yml` writes NeoSCAD.xcodeproj,
# which is a build output: gitignored and never edited by hand.
#
# Targets:
#   NeoSCADCore   framework: the UniFFI bindings (Core/Generated, written
#                 by scripts/apple/build-core.sh) and the async wrapper
#                 (Core/Engine.swift), linking the Rust core's XCFramework
#   NeoSCAD       the app: an NSDocument editor for .scad files, with the
#                 editor bundle (EditorBundle) in Resources/Editor
#   NeoSCADQuickLook  sandboxed Quick Look preview extension (picture,
#                 notes and source; Core/QuickLook.swift), in the app's
#                 PlugIns
#   NeoSCADThumbnail  sandboxed Quick Look thumbnail extension, likewise
#   NeoSCADTests  Swift tests of the core through the bindings
#   NeoSCADAppTests  tests hosted in the app: documents, the Render command
name: NeoSCAD

options:
  bundleIdPrefix: org.neoscad
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  # The core build phase's input file list must exist before Xcode plans
  # the first build; on a clean checkout this also builds the core once,
  # because Xcode resolves the XCFramework when it plans the build, before
  # any build phase can make it. The editor bundle's input list likewise.
  preGenCommand: ../scripts/apple/build-core.sh --prepare && ../scripts/apple/build-editor.sh --prepare

settings:
  base:
    # arm64 only: the Rust core is built for aarch64-apple-darwin alone,
    # and a new target defaults to arm64 + x86_64, whose x86_64 link would
    # fail (docs/audits/macos-prep.md, "arm64 only").
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    # Signed to run locally (ad hoc) until Developer ID signing (8j).
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  NeoSCADCore:
    type: framework
    platform: macOS
    sources:
      - path: Core
        excludes:
          - Generated
      # Written by the build phase below; listed even when missing (a clean
      # checkout before the first build) so the target compiles it.
      - path: Core/Generated/neoscad_ffi.swift
        optional: true
    dependencies:
      # First: the Rust core, which writes the XCFramework and the Swift
      # below.
      - target: RustCore
      - framework: build/NeoSCADCore.xcframework
        embed: false
      # What the Rust core (wgpu on Metal) calls.
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: Foundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.neoscad.NeoSCADCore
        PRODUCT_NAME: NeoSCADCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  NeoSCAD:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - target: NeoSCADCore
        embed: true
        codeSign: true
      # The editor's page and script, built before this target copies them.
      - target: EditorBundle
      # Embedded in Contents/PlugIns, where Quick Look finds them once the
      # app has been launched (or registered with lsregister).
      - target: NeoSCADQuickLook
      - target: NeoSCADThumbnail
    # The editor bundle into Resources/Editor, where
    # App/Editor/EditorSchemeHandler.swift serves it from. A script rather
    # than a folder reference: Xcode decides whether to copy a folder
    # reference by the folder's own time stamp, which a rebuilt file inside
    # it does not change, so the app could keep a stale bundle.
    postCompileScripts:
      - name: Copy editor bundle
        script: |
          dest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Editor"
          mkdir -p "$dest"
          for f in "${SCRIPT_INPUT_FILE_0}" "${SCRIPT_INPUT_FILE_1}" "${SCRIPT_INPUT_FILE_2}"; do
            cp "$f" "$dest/"
          done
        inputFiles:
          - $(SRCROOT)/Editor/web/dist/editor.html
          - $(SRCROOT)/Editor/web/dist/editor.js
          - $(SRCROOT)/Editor/web/dist/THIRD-PARTY-LICENSES.txt
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Editor/editor.html
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Editor/editor.js
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Editor/THIRD-PARTY-LICENSES.txt
        basedOnDependencyAnalysis: true
        showEnvVars: false
    info:
      path: App/Info.plist
      properties:
        CFBundleName: NeoSCAD
        CFBundleDisplayName: NeoSCAD
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.graphics-design
        # The system allocator keeps freed large blocks (128 KiB and up) in
        # a cache for reuse instead of returning them, and they count
        # against the app's footprint until the system is short of memory.
        # A run's evaluation and geometry allocate and free hundreds of
        # megabytes that way: with the cache, a document of 125 spheres
        # stayed at 775 MB after its preview (338 MB of it "Malloc Large
        # (empty)"); without, 177 MB (phase 8f, `footprint`). The price is
        # fresh pages for each large block: the same render took 8% longer
        # from the command line (0.66 to 0.72 s), which does not set this.
        # libmalloc reads it before `main`, so it can only come from the
        # environment; LaunchServices applies it to Finder, Dock and `open`
        # launches (not to a test host started by xcodebuild).
        LSEnvironment:
          MallocLargeCache: "0"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "GPL-2.0-or-later"
        # NeoSCAD edits OpenSCAD's format; it does not own it. The type is
        # imported (not exported) under OpenSCAD's own reverse-DNS prefix,
        # so if OpenSCAD ever exports org.openscad.scad, its declaration
        # wins and ours defers to it. OpenSCAD itself declares no UTI, so
        # without this Finder types .scad files as a dynamic type, and
        # Quick Look (8h) cannot match them.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.openscad.scad
            UTTypeDescription: OpenSCAD Design
            UTTypeConformsTo:
              - public.source-code
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - scad
        CFBundleDocumentTypes:
          - CFBundleTypeName: OpenSCAD Design
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.openscad.scad
            NSDocumentClass: SCADDocument
    entitlements:
      path: App/NeoSCAD.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.neoscad.NeoSCAD
        PRODUCT_NAME: NeoSCAD
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/NeoSCAD.entitlements

  # The Quick Look extensions (docs/audits/macos-prep.md, 8h). Sandboxed:
  # Quick Look grants each request the one file it is about. Both link
  # NeoSCADCore from the app's Frameworks (not a copy of their own: the
  # core is a few hundred MB of static Rust before stripping) through the
  # run path below, and list the exact imported UTI, because Quick Look
  # matches exact types, not the parents a type conforms to.
  #
  # Checking them: build, launch the app once (or `lsregister -f` it),
  # then `qlmanage -t -x -s 256 -o DIR FILE.scad` and `qlmanage -p
  # FILE.scad`; without `-x`, `qlmanage -t` draws in-process and never
  # reaches the extension. `xcodebuild test` re-signs the embedded
  # extensions with Xcode's testing exceptions (read-only access to `/`),
  # and a later `build` does not replace them, so delete
  # NeoSCAD.app/Contents/PlugIns and build again before checking the
  # sandbox.
  NeoSCADQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLook
        excludes:
          - Info.plist
    dependencies:
      - target: NeoSCADCore
        embed: false
      - sdk: QuickLookUI.framework
    info:
      path: QuickLook/Info.plist
      properties:
        CFBundleDisplayName: NeoSCAD Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "GPL-2.0-or-later"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.openscad.scad
            QLIsDataBasedPreview: true
            QLSupportsSearchableItems: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.neoscad.NeoSCAD.QuickLook
        PRODUCT_NAME: NeoSCADQuickLook
        # Set here rather than with XcodeGen's `entitlements:` key, which
        # rewrites the file from its `properties:` and drops the comment.
        CODE_SIGN_ENTITLEMENTS: QuickLook/NeoSCADQuickLook.entitlements
        ENABLE_APP_SANDBOX: YES
        # Xcode otherwise adds debugging entitlements to Debug builds,
        # among them a read-only exception for the whole disk (`/`), so a
        # Debug extension would read sibling includes that the shipped one
        # cannot. Off, Debug is sandboxed exactly as Release; the cost is
        # that a debugger cannot attach without re-signing.
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"

  NeoSCADThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: Thumbnail
        excludes:
          - Info.plist
    dependencies:
      - target: NeoSCADCore
        embed: false
      - sdk: QuickLookThumbnailing.framework
    info:
      path: Thumbnail/Info.plist
      properties:
        CFBundleDisplayName: NeoSCAD Thumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "GPL-2.0-or-later"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.openscad.scad
            QLThumbnailMinimumDimension: 16
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.neoscad.NeoSCAD.Thumbnail
        PRODUCT_NAME: NeoSCADThumbnail
        # Set here rather than with XcodeGen's `entitlements:` key, which
        # rewrites the file from its `properties:` and drops the comment.
        CODE_SIGN_ENTITLEMENTS: Thumbnail/NeoSCADThumbnail.entitlements
        ENABLE_APP_SANDBOX: YES
        # Xcode otherwise adds debugging entitlements to Debug builds,
        # among them a read-only exception for the whole disk (`/`), so a
        # Debug extension would read sibling includes that the shipped one
        # cannot. Off, Debug is sandboxed exactly as Release; the cost is
        # that a debugger cannot attach without re-signing.
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"

  NeoSCADTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: NeoSCADCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.neoscad.NeoSCADTests
        GENERATE_INFOPLIST_FILE: YES

  NeoSCADAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    dependencies:
      - target: NeoSCAD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.neoscad.NeoSCADAppTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/NeoSCAD.app/Contents/MacOS/NeoSCAD
        BUNDLE_LOADER: $(TEST_HOST)

aggregateTargets:
  # The Rust core's build (scripts/apple/build-core.sh) as a target of its
  # own that NeoSCADCore depends on, rather than a build phase inside
  # NeoSCADCore: Xcode processes a target's XCFrameworks before its first
  # build phase, so a phase in the same target that rewrites the
  # XCFramework is a dependency cycle ("Cycle inside NeoSCADCore").
  RustCore:
    buildScripts:
      - name: Build Rust core
        # Cargo, then the bindings and the XCFramework when the library
        # changed. Xcode skips the phase when no input is newer than the
        # outputs; the input list is every file cargo reads for the core.
        script: exec "${SRCROOT}/../scripts/apple/build-core.sh"
        inputFileLists:
          - $(SRCROOT)/build/core-inputs.xcfilelist
        outputFiles:
          - $(SRCROOT)/build/core.stamp
          - $(SRCROOT)/Core/Generated/neoscad_ffi.swift
          - $(SRCROOT)/build/NeoSCADCore.xcframework/Info.plist
        basedOnDependencyAnalysis: true
        showEnvVars: false
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # The editor bundle (scripts/apple/build-editor.sh): npm when the lock
  # file changed, then the grammar and esbuild. Skipped when no input is
  # newer than the outputs; the input list is every file the bundle is
  # built from.
  EditorBundle:
    buildScripts:
      - name: Build editor bundle
        script: exec "${SRCROOT}/../scripts/apple/build-editor.sh"
        inputFileLists:
          - $(SRCROOT)/build/editor-inputs.xcfilelist
        outputFiles:
          - $(SRCROOT)/build/editor.stamp
          - $(SRCROOT)/Editor/web/dist/editor.html
          - $(SRCROOT)/Editor/web/dist/editor.js
          - $(SRCROOT)/Editor/web/dist/THIRD-PARTY-LICENSES.txt
        basedOnDependencyAnalysis: true
        showEnvVars: false
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  NeoSCAD:
    build:
      targets:
        NeoSCAD: all
        NeoSCADTests: [test]
        NeoSCADAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NeoSCADTests
        - NeoSCADAppTests
    archive:
      config: Release
