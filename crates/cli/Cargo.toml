[package]
name = "neoscad-cli"
description = "The neoscad command-line tool (OpenSCAD-compatible flags)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# The one package cargo-dist ships (the workspace default is `dist = false`;
# see [workspace.metadata.dist] in the root Cargo.toml).
[package.metadata.dist]
dist = true

# The MSI (written by `dist generate` to wix/main.wxs). The GUIDs identify
# the product across upgrades: never change them. LICENSE installs beside
# the binary, with no click-through page (the GPL needs none); NOTICE and
# licenses/ are hand-added to main.wxs (hence `allow-dirty = ["msi"]`).
[package.metadata.wix]
upgrade-guid = "B8763D68-FA75-4E47-B0AA-0423F21CE7DD"
path-guid = "2D8756D7-4A09-48A6-AD12-20F2C29E529B"
license = "../../LICENSE"
eula = false

[[bin]]
name = "neoscad"
path = "src/main.rs"

[features]
# Compile the Liberation fonts and the MCAD library into the binary (about
# 4.3 MB), so the default font and `include <MCAD/...>` work with nothing
# installed, as they do in OpenSCAD, which ships them as resources.
default = ["bundled-assets", "mimalloc"]
bundled-assets = ["dep:assets"]
# mimalloc as the global allocator (`main.rs`). A feature only so that a
# cross-target `cargo check` can leave out its C build: checking the
# Windows code from macOS or Linux has no MSVC compiler or Windows SDK
# headers for mimalloc's sources (docs/serve-protocol.md, "Platforms").
# Every shipped build keeps it.
mimalloc = ["dep:mimalloc"]

[dependencies]
# `neoscad serve --socket` and the desktop apps' agent link
# (src/transport.rs, src/mcp/app.rs): per-user sockets and pipes with
# owner checks, where running apps listen, and their protocol.
agent-link = { package = "neoscad-agent-link", path = "../agent-link" }
assets = { package = "neoscad-assets", path = "../assets", optional = true }
# `neoscad bench` (src/bench.rs): the timing, kit, result schema and
# official-release check it shares with `conformance bench`. Everything it
# links (serde, sha2, flate2's pure-Rust backend, nix) is already in this
# binary, so it adds only its own code.
bench-core = { package = "neoscad-bench-core", path = "../bench-core" }
clap.workspace = true
# `neoscad generate` (src/generate.rs): the manual page and the shell
# completion scripts, from the same clap definitions as `--help`; roff is
# what clap_mangen writes with, for the page's own sections. All three are
# MIT OR Apache-2.0.
# The update notice (src/update.rs): the signed feed's check, shared with
# the apps. Named apart from this crate's own `client` module (the
# serve client). Everything it links is already in this binary, apart
# from minisign-verify (MIT, no dependencies).
neoscad_client = { package = "neoscad-client", path = "../client" }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
roff = "1.1.1"
lang = { package = "neoscad-lang", path = "../lang" }
eval = { package = "neoscad-eval", path = "../eval" }
geom = { package = "neoscad-geom", path = "../geom" }
io = { package = "neoscad-io", path = "../io" }
lsp = { package = "neoscad-lsp", path = "../lsp" }
render = { package = "neoscad-render", path = "../render" }
session = { package = "neoscad-session", path = "../session" }
serde_json.workspace = true
text = { package = "neoscad-text", path = "../text" }
# `neoscad mcp --browser` (src/mcp/bridge.rs): the WebSocket the web
# demo's tab connects to. tungstenite is synchronous (no async runtime,
# like the rest of this crate); "handshake" is only for the
# Sec-WebSocket-Accept key and the tests' client, since the server reads
# the request itself to check its Host, Origin and token first. getrandom
# for the pairing token (the OS's generator; already in the build).
# Both are MIT OR Apache-2.0.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
getrandom = "0.4"

# The global allocator (see `main.rs`). Native only: the WASM build keeps
# Rust's default allocator, and never builds this crate anyway.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# The memory limit's measurement (src/memory.rs): `proc_pid_rusage` on
# macOS, the page size on Linux. Already in the build through nix and
# mimalloc.
libc = "0.2"

# The memory limit's measurement on Windows (src/memory.rs,
# `ProcessStatus`). The server's named pipe and its access check moved to
# crates/agent-link with the rest of the transport.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

# The workspace's lints, written out because one differs: `unsafe_code` is
# `deny` rather than the workspace's `forbid`, since `forbid` cannot be
# lifted for a single module. `src/memory.rs` (the process's memory, a
# system call on every platform) is the module that allows it; everything
# else here still refuses `unsafe`. Keep the rest in step with
# `[workspace.lints]`.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[dev-dependencies]
png.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
