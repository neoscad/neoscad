[package]
name = "neoscad-cli"
description = "The neoscad command-line tool (OpenSCAD-compatible flags)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "neoscad"
path = "src/main.rs"

[dependencies]
clap.workspace = true
lang = { package = "neoscad-lang", path = "../lang" }
eval = { package = "neoscad-eval", path = "../eval" }

[lints]
workspace = true
