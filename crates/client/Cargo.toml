[package]
name = "neoscad-client"
description = "The host-neutral glue every NeoSCAD front end shares over a `session::Session`: document runs, console lines in editor positions, the customizer, check, measure and export, shaped as serde records (the macOS app wraps them for UniFFI in `crates/ffi`, the web worker sends them as JSON from `crates/web`)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "client"

[dependencies]
eval = { package = "neoscad-eval", path = "../eval" }
geom = { package = "neoscad-geom", path = "../geom" }
io = { package = "neoscad-io", path = "../io" }
lang = { package = "neoscad-lang", path = "../lang" }
# The update feed's signature (src/update.rs): Ed25519 minisign
# verification in pure Rust with no dependencies of its own, so the check
# builds for wasm32 like the rest of this crate. MIT.
minisign-verify = "0.3.0"
# Without the GPU, so the web worker builds it for wasm32; the app's core
# turns the GPU on for itself (Cargo unifies the features).
render = { package = "neoscad-render", path = "../render", default-features = false }
# Release versions in the update feed, ordered with their prereleases
# (0.3.0-rc.1 < 0.3.0). Already in the build; MIT OR Apache-2.0.
semver = "1"
serde.workspace = true
serde_json.workspace = true
session = { package = "neoscad-session", path = "../session", default-features = false }

[dev-dependencies]
assets = { package = "neoscad-assets", path = "../assets" }
# The disk, for tests only (`lang`'s `host` feature; see lang/src/host.rs).
lang = { package = "neoscad-lang", path = "../lang", features = ["host"] }
# Thread pools of different sizes, for the scene determinism test.
rayon.workspace = true

[lints]
workspace = true
