[package]
name = "neoscad-conformance"
description = "Runs OpenSCAD's regression suite against neoscad and records progress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "conformance"
path = "src/main.rs"

[dependencies]
# `conformance bench` times through the same code as `neoscad bench`.
bench-core = { package = "neoscad-bench-core", path = "../bench-core" }
clap.workspace = true
png.workspace = true
rayon.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# `post_process_3mf`: a 3MF export compares as the XML inside its zip, read
# with the same pure-Rust deflate backend as crates/io.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
