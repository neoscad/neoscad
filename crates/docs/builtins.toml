# --- functions: other ---------------------------------------------------------------

[[function]]
name = "version"
signature = "version()"
summary = "OpenSCAD's version as [year, month, day]."
params = []
returns = "vector"
example = "echo(version());"

[[function]]
name = "version_num"
signature = "version_num()"
summary = "OpenSCAD's version as one number, year * 10000 + month * 100 + day."
params = []
returns = "number"
example = "echo(version_num() >= 20210101);"

[[function]]
name = "parent_module"
signature = "parent_module(n)"
summary = "Name of the module n levels up the call stack (0: the current one)."
params = ["n: number -- levels up"]
returns = "string"
example = "module who() echo(parent_module(0));\nwho();  // \"who\""

[[function]]
name = "dxf_dim"
signature = "dxf_dim(file, name, layer, origin, scale)"
summary = "A named dimension's value from a DXF drawing."
params = [
    "file: string -- the DXF file",
    "name: string -- the dimension's name",
    "layer: string -- only this layer",
    "origin: [x, y] -- offset",
    "scale: number -- factor",
]
returns = "number"
example = "echo(dxf_dim(file=\"drawing.dxf\", name=\"width\"));"

[[function]]
name = "dxf_cross"
signature = "dxf_cross(file, layer, origin, scale)"
summary = "The crossing point of the two lines on a DXF layer."
params = [
    "file: string -- the DXF file",
    "layer: string -- the layer with two lines",
    "origin: [x, y] -- offset",
    "scale: number -- factor",
]
returns = "[x, y]"
example = "echo(dxf_cross(file=\"drawing.dxf\", layer=\"center\"));"

[[function]]
name = "child_anchors"
signature = "child_anchors(index = undef)"
summary = "Inside a module: the anchors of what children(index) would instantiate here, as an object from each name to [point, dir], in the module's frame."
extension = "query"
params = ["index: number, list or range = undef -- which children, as children() takes it; all of them when omitted"]
returns = "object, or undef with a warning (outside a module, a bad index)"
example = "module plate_under() {\n  a = child_anchors(0);\n  tip = a.tip[0];\n  translate([tip[0] - 5, tip[1] - 5, -2]) cube([10, 10, 2]);\n  children(0);\n}\nplate_under() translate([3, 4, 0]) { cylinder(d = 2, h = 5); anchor(\"tip\", [0, 0, 5], [0, 0, 1]); }"
notes = "Points are always [x, y, z] and directions unit vectors (undef when none was given). No rendering is involved: the child is instantiated early, its messages held back, and a later children(index) with the same $ variables reuses the instance, printing them then, so a query changes nothing else a model prints or builds. The first anchor of a name wins, with a warning for the others (query-duplicate-anchor). Outside a module it warns (query-outside-module); a bad index warns (query-index). Without --enable query it is an unknown function, as in OpenSCAD."

[[function]]
name = "child_bounds"
signature = "child_bounds(index = undef)"
summary = "Inside a module: the bounding box [min, max] of what children(index) would make here, rendered, in the module's frame."
extension = "query"
params = ["index: number, list or range = undef -- which children, as children() takes it; all of them when omitted"]
returns = "[[x0, y0, z0], [x1, y1, z1]] for a 3D child, [[x0, y0], [x1, y1]] for a 2D one; undef with a warning when it renders to nothing (query-empty), outside a module, or with a bad index"
example = "module plate_for(margin = 2) {\n  b = child_bounds(0);\n  translate([b[0][0] - margin, b[0][1] - margin, -2])\n    cube([b[1][0] - b[0][0] + 2 * margin, b[1][1] - b[0][1] + 2 * margin, 2]);\n  children(0);\n}\nplate_for() translate([5, 0, 0]) cylinder(d = 10, h = 4);"
notes = "The child is rendered as a full render would render it, in preview too: % children are left out and # children kept, so the model has the same shape in both. The box is that of the result (a difference() is measured after the cut), in the same format as BOSL2's pointlist_bounds(). The render shares the geometry cache with the final render, so the child is built once, and the child's geometry warnings are printed once, by the final render. Each query counts against the queries resource limit; the time limit and cancellation stop its render. A later children(index) reuses the instantiated child as with child_anchors(). Without --enable query it is an unknown function, as in OpenSCAD."

[[function]]
name = "child_measure"
signature = "child_measure(index = undef)"
summary = "Inside a module: the measurements of what children(index) would make here, rendered: an object with dim, empty, bounds, size, center, and area (2D) or volume and surface_area (3D)."
extension = "query"
params = ["index: number, list or range = undef -- which children, as children() takes it; all of them when omitted"]
returns = "object; undef with a warning outside a module or with a bad index"
example = "module report() {\n  m = child_measure(0);\n  echo(volume = m.volume, size = m.size, center = m.center);\n  children(0);\n}\nreport() difference() { cube(10); translate([5, 5, -1]) cube(20); }"
notes = "Measured as child_bounds() measures, from the same render. dim is 2 or 3; for a child that renders to nothing, empty is true and dim, bounds, size and center are undef (no warning: the object says so). Areas and volumes are summed over the rendered mesh in a fixed order, so they are the same at any thread count and on every platform. Without --enable query it is an unknown function, as in OpenSCAD."

[[function]]
name = "child_distance"
signature = "child_distance(a, b)"
summary = "Inside a module: the smallest distance between what children(a) and children(b) would make here, rendered; 0 where they overlap."
extension = "query"
params = [
    "a: number, list or range -- the first children, as children() takes them",
    "b: number, list or range -- the second children",
]
returns = "number; undef with a warning when either renders to nothing (query-empty), when one is 2D and the other 3D, outside a module, or with a bad index"
example = "module clearance() {\n  echo(gap = child_distance(0, 1));\n  children();\n}\nclearance() {\n  cube(10);\n  translate([13, 0, 0]) cube(10);\n}"
notes = "Measured on the rendered children as measure --between measures two parts: 0 when they overlap by more than a sliver, one inside the other included; otherwise the exact smallest distance between their surfaces, which is 0 where they touch. Two 2D children are compared in the plane. Both children are rendered through the shared geometry cache, and the call counts as one query against the queries resource limit. A later children(a) or children(b) reuses the instantiated child as with child_anchors(). Without --enable query it is an unknown function, as in OpenSCAD."

[[function]]
name = "echo"
signature = "echo(values...) expression"
summary = "Print values, then return the expression's value (for tracing functions)."
params = ["values: any -- printed as the echo module prints them"]
returns = "the expression's value"
example = "function f(x) = echo(\"f\", x) x * 2;\ny = f(3);"

[[function]]
name = "assert"
signature = "assert(condition, message) expression"
summary = "Stop with an error when the condition is false, else return the expression."
params = ["condition: any -- must be true", "message: any -- shown with the error"]
returns = "the expression's value"
example = "function half(x) = assert(is_num(x), \"x must be a number\") x / 2;\necho(half(4));"

[[function]]
name = "let"
signature = "let (name = value, ...) expression"
summary = "The expression evaluated with extra variables."
params = ["name = value -- a binding; later ones see earlier ones"]
returns = "the expression's value"
example = "echo(let (a = 2, b = a * 3) a + b);  // 8"

# --- special variables -------------------------------------------------------------

[[variable]]
name = "$fn"
signature = "$fn = 0"
summary = "Fixed number of segments for circles, spheres, cylinders and arcs; 0 uses $fa and $fs."
params = []
example = "sphere(5, $fn=64);"
notes = "Values of 3 or more override $fa/$fs. Like every $ variable it passes down to the calls below where it is set."

[[variable]]
name = "$fa"
signature = "$fa = 12"
summary = "Minimum angle in degrees per segment of a curve (used when $fn is 0)."
params = []
example = "$fa = 6;\ncircle(10);"

[[variable]]
name = "$fs"
signature = "$fs = 2"
summary = "Minimum length in mm of a curve's segment (used when $fn is 0)."
params = []
example = "$fs = 0.5;\ncircle(10);"

[[variable]]
name = "$t"
signature = "$t = 0"
summary = "Animation time, from 0 to 1 across the frames of an animation."
params = []
example = "rotate([0, 0, 360 * $t]) cube(5);"

[[variable]]
name = "$preview"
signature = "$preview"
summary = "True in preview (and preview-style exports), false in a full render."
params = []
example = "sphere(5, $fn=$preview ? 16 : 64);"

[[variable]]
name = "$vpt"
signature = "$vpt"
summary = "The camera's target point [x, y, z]; assign it at top level to set the view."
params = []
example = "echo($vpt);"

[[variable]]
name = "$vpr"
signature = "$vpr"
summary = "The camera's rotation [x, y, z] in degrees; assign it at top level to set the view."
params = []
example = "$vpr = [60, 0, 30];\ncube(5);"

[[variable]]
name = "$vpd"
signature = "$vpd"
summary = "The camera's distance from its target; assign it at top level to set the view."
params = []
example = "echo($vpd);"

[[variable]]
name = "$vpf"
signature = "$vpf = 22.5"
summary = "The camera's field of view in degrees."
params = []
example = "echo($vpf);"

[[variable]]
name = "$children"
signature = "$children"
summary = "Inside a module: how many children its call has."
params = []
example = "module count() echo($children);\ncount() { cube(1); sphere(1); }  // 2"

[[variable]]
name = "$parent_modules"
signature = "$parent_modules"
summary = "Inside a module: how many module calls are on the stack (for parent_module())."
params = []
example = "module depth() echo($parent_modules);\ndepth();"

[[variable]]
name = "PI"
signature = "PI"
summary = "The constant pi, 3.14159..."
params = []
example = "echo(2 * PI * 5);  // circumference of r=5"
