[package]
name = "neoscad-eval"
description = "OpenSCAD evaluator: values, builtins, scoping and module instantiation into a node tree"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "eval"

[features]
# The heap evaluator: statements and module instantiation run on an
# explicit stack of frames instead of native recursion (`src/heap.rs`), so
# module recursion ends at the counted depth limit (`limits::Limits::depth`)
# in every build and browser. A compile-time switch, so the default build
# keeps the recursive evaluator's code and layout unchanged
# (docs/audits/heap-evaluator.md, section 3).
heap-eval = []

[dependencies]
io = { package = "neoscad-io", path = "../io" }
lang = { package = "neoscad-lang", path = "../lang" }
sha2.workspace = true
text = { package = "neoscad-text", path = "../text" }
unicode-script.workspace = true

# Geometry keys hash sibling subtrees on rayon's pool (`dump::Keys`).
# wasm32-unknown-unknown has no threads, so it hashes serially and does not
# link rayon at all.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon.workspace = true

[dev-dependencies]
assets = { package = "neoscad-assets", path = "../assets" }

[lints]
workspace = true
