[package]
name = "neoscad-ffi"
description = "The NeoSCAD core for the macOS and Windows apps: a UniFFI bridge over `session::Session` (native only; not part of the WASM build)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "neoscad_ffi"
# `staticlib` is what the macOS app links (through the XCFramework that
# scripts/apple/build-core.sh makes); `lib` is for `cargo test`. The
# Windows app loads a DLL, which scripts/windows/build-core.ps1 asks for
# with `cargo rustc --crate-type cdylib`, so macOS builds do not link a
# dylib nobody uses.
crate-type = ["staticlib", "lib"]

[features]
default = ["mimalloc"]
# mimalloc as the core's global allocator (`lib.rs`). A feature only so
# that `cargo clippy --target x86_64-pc-windows-msvc -p neoscad-ffi` can
# run off Windows: mimalloc's C sources need MSVC and the Windows SDK
# headers, which a cross check does not have (as for `neoscad-cli`,
# docs/serve-protocol.md, "Platforms"). Every app build keeps it on.
mimalloc = ["dep:mimalloc"]

[dependencies]
# The agent link (`agent.rs`): the listener `neoscad mcp` connects to once
# the user allows agents, over a per-user socket or pipe.
agent-link = { package = "neoscad-agent-link", path = "../agent-link" }
assets = { package = "neoscad-assets", path = "../assets" }
# The host-neutral glue (runs, console lines, customizer, check, measure,
# export), shared with the web worker; its records cross as remote types.
client = { package = "neoscad-client", path = "../client" }
eval = { package = "neoscad-eval", path = "../eval" }
# `host`: the disk and the environment's library path (lang/src/host.rs).
lang = { package = "neoscad-lang", path = "../lang", features = ["host"] }
lsp = { package = "neoscad-lsp", path = "../lsp" }
render = { package = "neoscad-render", path = "../render" }
serde_json.workspace = true
session = { package = "neoscad-session", path = "../session" }
text = { package = "neoscad-text", path = "../text" }
# The global allocator of the app's core (see `lib.rs`).
mimalloc = { workspace = true, optional = true }
uniffi = { version = "=0.32.2", default-features = false }
# The window surface for the viewport: `SurfaceTargetUnsafe` (the same
# wgpu the renderer uses; no second copy is built).
wgpu = "30"

# The memory limit's measurement (`memory.rs`, shared with crates/cli):
# `proc_pid_rusage` on macOS, the page size on Linux, and on Windows the
# process's private bytes. Both already in the build (wgpu, mimalloc).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
# `IDXGISwapChain2::SetMatrixTransform` on the `SwapChainPanel`'s swap
# chain, for the inverse of the display scale (`layer.rs`). The version
# wgpu-hal's DX12 backend already builds (it hands out the swap chain as
# this crate's `IDXGISwapChain3`), so this adds no second copy, only the
# `Dxgi` feature it enables too.
windows = { version = "0.62", default-features = false, features = ["Win32_Graphics_Dxgi"] }

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
# The viewport tests draw into a real `CAMetalLayer` (not in a window), so
# the unsafe surface path runs under `cargo test`. Already in the build
# through wgpu's Metal backend.
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer"] }

# The workspace's lints, written out because one differs: `unsafe_code` is
# `deny` rather than the workspace's `forbid`, since `forbid` cannot be
# lifted for a single module and the viewport must turn the app's
# `CAMetalLayer` pointer into a wgpu surface. `src/layer.rs` and `memory.rs`
# (the process's memory, shared with crates/cli) are the modules that allow
# it; everything else here still refuses `unsafe`.
# UniFFI's `extern "C"` exports come from its macros, which the lint does
# not look into. Keep the rest in step with `[workspace.lints]`.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
