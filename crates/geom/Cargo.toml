[package]
name = "neoscad-geom"
description = "Geometry for NeoSCAD: primitives, the Manifold kernel, CSG evaluation of the node tree and mesh export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "geom"

[features]
# Evaluate independent subtrees on rayon's pool and let the kernel use its
# own determinism-preserving parallelism. On wasm32 the feature is a no-op,
# so default features work there: wasm32-unknown-unknown cannot spawn
# threads, and building geom's pool panicked at render time. geom's own
# parallel code is gated on the target (Cargo cannot enable a dependency's
# feature for some targets only), and the kernel's parallel loops run on
# rayon's global pool, which falls back to the calling thread when threads
# are unsupported (rayon-core's `default_global_registry`). The output is
# identical either way.
default = ["parallel"]
parallel = ["dep:rayon", "manifold-rust/parallel"]

[dependencies]
# Pinned exactly, like manifold-rust (which depends on the same version):
# offset() output is Clipper's arc stepping vertex for vertex.
clipper2-rust = "=1.2.0"
eval = { package = "neoscad-eval", path = "../eval" }
io = { package = "neoscad-io", path = "../io" }
lang = { package = "neoscad-lang", path = "../lang" }
# Pinned exactly: the port tracks Manifold C++ v3.5.0 and its output
# (triangle topology, run order) is part of what the tier 3 images see.
manifold-rust = { version = "=0.13.1", default-features = false }
rayon = { workspace = true, optional = true }
# A preview product's cache key (`csg::product_key`), hashed as
# the evaluator hashes subtree keys. Already in the build through `eval`.
sha2.workspace = true
text = { package = "neoscad-text", path = "../text" }

[lints]
workspace = true
