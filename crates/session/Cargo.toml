[package]
name = "neoscad-session"
description = "The long-lived NeoSCAD core every client uses (the CLI, `neoscad serve`, the MCP server, the apps, WASM): open documents, warm parse and geometry caches, evaluate, render, export, snapshot and cancellation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "session"

[features]
# Snapshots draw on the GPU. Without the feature (the WASM check module,
# which runs in node with no WebGPU) everything else still works and
# `Session::snapshot` reports that it has no GPU.
default = ["gpu"]
gpu = ["render/gpu"]

[dependencies]
eval = { package = "neoscad-eval", path = "../eval" }
geom = { package = "neoscad-geom", path = "../geom" }
io = { package = "neoscad-io", path = "../io" }
lang = { package = "neoscad-lang", path = "../lang" }
render = { package = "neoscad-render", path = "../render", default-features = false }
serde_json.workspace = true
text = { package = "neoscad-text", path = "../text" }

[lints]
workspace = true
