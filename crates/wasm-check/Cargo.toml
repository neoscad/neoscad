[package]
name = "neoscad-wasm-check"
description = "A wasm32 build of the NeoSCAD pipeline with an in-memory file system, run in node by scripts/wasm-check.sh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "wasm_check"
# `cdylib` is the module node loads; `rlib` lets the native tests run the
# same cases through the same code.
crate-type = ["cdylib", "rlib"]

[features]
default = ["heap-eval"]
# The heap evaluator (`neoscad-eval`'s `heap-eval`): recursion runs on
# a heap stack, bounded by the counted depth limit and not by the native
# stack. On by default, as in the web core (docs/audits/heap-evaluator.md);
# NEOSCAD_NO_DEFAULT_FEATURES=1 scripts/wasm-check.sh checks the
# recursive evaluator.
heap-eval = ["eval/heap-eval"]

[dependencies]
assets = { package = "neoscad-assets", path = "../assets" }
eval = { package = "neoscad-eval", path = "../eval" }
# Default features, `parallel` included: the web build must work with them.
geom = { package = "neoscad-geom", path = "../geom" }
lang = { package = "neoscad-lang", path = "../lang" }
# The language server, as a web worker would run it.
lsp = { package = "neoscad-lsp", path = "../lsp" }
# Without the GPU: the module is loaded by node without wasm-bindgen glue,
# so it runs the renderer's CPU side only. `scripts/wasm-check.sh` builds
# the GPU side for wasm32 separately.
render = { package = "neoscad-render", path = "../render", default-features = false }
# The session every client uses, without the GPU (as `render` above).
session = { package = "neoscad-session", path = "../session", default-features = false }
serde_json.workspace = true
text = { package = "neoscad-text", path = "../text" }


# The workspace lints, except that `unsafe_code` is `deny` rather than
# `forbid`: exporting a function to JavaScript needs `#[unsafe(no_mangle)]`,
# which the lint counts as unsafe code, so the exports (and nothing else)
# allow it. The crate has no other unsafe code.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
