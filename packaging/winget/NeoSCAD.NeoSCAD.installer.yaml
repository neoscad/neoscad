# Template (scripts/release/fill-manifests.sh fills @VERSION@ and the
# hashes). The portable zips cargo-dist makes, not the MSI: the MSI is not
# Authenticode-signed yet, and winget's validation flags unsigned
# installers (docs/packaging.md).
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
PackageIdentifier: NeoSCAD.NeoSCAD
PackageVersion: "@VERSION@"
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: neoscad.exe
    PortableCommandAlias: neoscad
Commands:
  - neoscad
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/neoscad/neoscad/releases/download/v@VERSION@/neoscad-cli-x86_64-pc-windows-msvc.zip
    InstallerSha256: "@SHA256_X86_64_PC_WINDOWS_MSVC@"
  - Architecture: arm64
    InstallerUrl: https://github.com/neoscad/neoscad/releases/download/v@VERSION@/neoscad-cli-aarch64-pc-windows-msvc.zip
    InstallerSha256: "@SHA256_AARCH64_PC_WINDOWS_MSVC@"
ManifestType: installer
ManifestVersion: 1.12.0
