<!doctype html>
<!--
  The NeoSCAD web demo. Every URL here is relative, so the bundle works
  unpacked under any path (/try/ on neoscad.org). The site's site.json and
  theme.css are found through the neoscad-site meta tag (web/src/site.js).

  The policy: scripts, workers and wasm only from this origin (wasm needs
  'wasm-unsafe-eval'); CodeMirror writes style elements, hence inline
  styles; downloads are blob: URLs. The only other connection allowed is a
  WebSocket to this computer's loopback address, any port: the agent
  bridge of `neoscad mcp --browser` (src/agent/, which checks the token).
  Frames of this page are allowed from its own origin only, but that is
  checked in app.js (framing() in src/share.js): `frame-ancestors` is
  ignored in a meta tag, and the static site cannot send headers.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="neoscad-site" content="../site.json" />
    <title>Try NeoSCAD</title>
    <!--
      For search engines and link previews. The bundle is relative so it
      can be unpacked anywhere, but it is published at neoscad.org/try/, and
      these URLs must be absolute: the canonical names that address (so
      /try/index.html and links with a fragment count as one page), and the
      image is the home page's hero still, as the JPEG its og:image uses.
      Every fact here is on the site: the download page's "In the browser"
      and the home page's hero. The JSON-LD block is data, not script, so script-src
      neither runs nor blocks it; embed links (#embed=1) are this same
      document, which is why it describes the whole page.
    -->
    <meta
      name="description"
      content="OpenSCAD's language in your browser: NeoSCAD compiled to WebAssembly, an editor with examples, rendering with WebGPU or WebGL 2. Nothing is uploaded."
    />
    <link rel="canonical" href="https://neoscad.org/try/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NeoSCAD" />
    <meta property="og:title" content="Try NeoSCAD: OpenSCAD in your browser" />
    <meta
      property="og:description"
      content="OpenSCAD's language in your browser: NeoSCAD compiled to WebAssembly, an editor with examples, rendering with WebGPU or WebGL 2. Nothing is uploaded."
    />
    <meta property="og:url" content="https://neoscad.org/try/" />
    <meta property="og:image" content="https://neoscad.org/assets/hero-gearbox.jpg" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1350" />
    <meta
      property="og:image:alt"
      content="A herringbone planetary gearbox. Rendered in 1.77 s by NeoSCAD, OpenSCAD nightly: 5.89 s."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "NeoSCAD",
        "url": "https://neoscad.org/try/",
        "description": "NeoSCAD compiled to WebAssembly: an editor with examples, rendering in your browser with WebGPU, or WebGL 2 where WebGPU isn't available. Nothing is uploaded.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Web browser",
        "browserRequirements": "WebAssembly; WebGPU or WebGL 2",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "image": "https://neoscad.org/assets/hero-gearbox.jpg",
        "publisher": { "@id": "https://neoscad.org/#organization" }
      }
    </script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="app.css" />
    <script src="early.js"></script>
  </head>
  <body>
    <!-- The page's title for search engines and screen readers; the
         workspace has no room for it on screen, so it is visually hidden. -->
    <h1 class="visually-hidden">Try NeoSCAD: OpenSCAD in your browser</h1>
    <header id="topbar" class="topbar"></header>
    <div id="banner" class="banner" role="note" hidden></div>
    <main id="workspace" class="workspace">
      <section id="pane-left" class="pane-left" aria-label="Source">
        <div id="editor-tabs" class="editor-tabs" role="tablist"></div>
        <div id="editor" class="editor"></div>
        <div id="split-console" class="splitter splitter-h" role="separator" aria-orientation="horizontal"></div>
        <section id="console" class="console" aria-label="Console"></section>
      </section>
      <div id="split-left" class="splitter splitter-v" role="separator" aria-orientation="vertical"></div>
      <section id="pane-view" class="pane-view" aria-label="3D view">
        <canvas id="viewport" data-testid="viewport"></canvas>
        <div id="view-notice" class="view-notice" role="note" data-testid="view-notice" hidden></div>
      </section>
      <nav id="mobile-tabs" class="mobile-tabs" role="tablist" aria-label="Panels"></nav>
      <div id="split-right" class="splitter splitter-v" role="separator" aria-orientation="vertical"></div>
      <aside id="inspector" class="inspector" aria-label="Inspector">
        <div id="inspector-tabs" class="segmented" role="tablist"></div>
        <section id="panel-customizer" class="panel" role="tabpanel" data-testid="customizer"></section>
        <section id="panel-check" class="panel" role="tabpanel" data-testid="check" hidden></section>
        <section id="panel-measure" class="panel" role="tabpanel" data-testid="measure" hidden></section>
      </aside>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
